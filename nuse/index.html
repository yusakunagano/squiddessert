<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="今日のことや気分、気になる言葉を話しかけると、AI の猫「Nyaaz」が会話でひらめきを引き出します。">
<title>Nyaaz</title>
<style>
  :root { --paper:#ffffff; --card:#ffffff; --bubble:#ececef; --ink:#1c1c1e; --muted:#8a8a90; --line:#e2e2e6; --accent:#1c1c1e; --accent-soft:#ececef; --on-accent:#ffffff; --err:#c62828; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#000000; --card:#1c1c1f; --bubble:#232327; --ink:#f2f2f4; --muted:#9a9aa2; --line:#2e2e33; --accent:#f2f2f4; --accent-soft:#2a2a2e; --on-accent:#111111; --err:#ff8a80; color-scheme:dark; } }
  :root[data-theme="dark"] { --paper:#000000; --card:#1c1c1f; --bubble:#232327; --ink:#f2f2f4; --muted:#9a9aa2; --line:#2e2e33; --accent:#f2f2f4; --accent-soft:#2a2a2e; --on-accent:#111111; --err:#ff8a80; color-scheme:dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; line-height:1.75; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .app { position:relative; max-width:40rem; margin:0 auto; height:100dvh; overflow:hidden; display:flex; flex-direction:column; padding-inline:14px; }
  /* 上端：会話は薄く消えていき、その手前にキャラと名前のラベルだけが重なる */
  .app::before { content:""; position:absolute; inset:0 0 auto 0; height:235px; z-index:4; pointer-events:none; background:linear-gradient(var(--paper) 0%, var(--paper) 52%, transparent 100%); }
  #cat3d { position:absolute; top:6px; left:50%; transform:translateX(-50%); z-index:5; width:190px; height:190px; pointer-events:none; }
  #cat3d canvas { display:block; width:190px; height:190px; }
  #cat3d .face { font-size:90px; line-height:190px; display:block; text-align:center; }
  .cat3d-on #cat3d .face { display:none; }
  .namepill { position:absolute; top:164px; left:50%; transform:translateX(-50%); z-index:6; background:var(--card); color:var(--ink); font-weight:700; font-size:1rem; letter-spacing:.02em; padding:5px 20px; border-radius:999px; box-shadow:0 2px 12px rgba(0,0,0,.08); pointer-events:none; }
  .hero { flex:none; height:218px; }
  /* 画面が低いとき（キーボードが開いたときなど）は、キャラを小さくする */
  @media (max-height:560px) { #cat3d, #cat3d canvas { width:104px !important; height:104px !important; } #cat3d .face { font-size:52px; line-height:104px; } .namepill { top:88px; font-size:.85rem; padding:3px 14px; } .hero { height:126px; } .app::before { height:140px; } .app .step { max-height:34dvh; } }
  .btn:focus-visible, textarea:focus-visible, .ghost:focus-visible, .send:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding-block:0 12px; }
  .msg { padding:14px 18px; border-radius:26px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.bot { align-self:stretch; background:var(--bubble); }
  .msg.me { align-self:flex-end; max-width:82%; background:var(--accent); color:var(--on-accent); border-radius:24px 24px 8px 24px; }
  .msg.err { align-self:center; padding:4px; color:var(--err); font-weight:700; font-size:.9rem; background:none; }
  .msg.wait { color:var(--muted); font-size:.9rem; }
  form { display:flex; gap:8px; align-items:flex-end; padding:6px 6px 6px 18px; margin-top:4px; background:var(--bubble); border-radius:30px; }
  textarea { flex:1; min-width:0; max-height:8rem; padding:8px 0; font:inherit; border:none; background:transparent; color:var(--ink); resize:none; }
  textarea:focus-visible { outline:none; }
  textarea::placeholder { color:var(--muted); }
  .send { flex:none; width:40px; height:40px; border-radius:50%; border:none; background:var(--accent); color:var(--on-accent); cursor:pointer; display:grid; place-items:center; padding:0; }
  .send:disabled { opacity:.35; cursor:default; }
  .btn { font:inherit; font-weight:700; padding:10px 20px; border-radius:999px; border:none; background:var(--accent); color:var(--on-accent); cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:default; }
  .cal { display:flex; justify-content:center; padding-bottom:6px; }
  .cal .btn { background:var(--bubble); color:var(--ink); font-size:.85rem; padding:7px 18px; }
  .step { flex:none; max-height:50dvh; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:16px; display:grid; gap:10px; margin-bottom:8px; }
  .step label { display:grid; gap:2px; font-size:.8rem; color:var(--muted); font-weight:700; }
  .step input, .step select { font:inherit; color:var(--ink); background:var(--bubble); border:none; border-radius:12px; padding:8px 12px; min-width:0; }
  .step .row { display:grid; grid-template-columns:1fr auto; gap:8px; }
  .step .acts { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .step .btn { padding:9px 18px; }
  .step .note { font-size:.75rem; color:var(--muted); margin:0; }
  .step .ok { color:var(--ink); font-weight:700; margin:0; }
  .step .ok a { color:inherit; }
  .step p:empty { display:none; }
  .step .bad { color:var(--err); font-weight:700; margin:0; font-size:.85rem; }
  .foot { display:flex; justify-content:space-between; gap:12px; font-size:.75rem; color:var(--muted); padding:6px 6px max(10px, env(safe-area-inset-bottom)); }
  .ghost { font:inherit; font-size:.75rem; background:none; border:none; color:var(--muted); cursor:pointer; padding:0; text-decoration:underline; }
</style>
</head>
<body>
<div class="app">
  <div id="cat3d" aria-hidden="true"><span class="face">🐱</span></div>
  <div class="namepill" aria-hidden="true">Nyaaz</div>

  <div id="log" role="log" aria-live="polite"></div>

  <div class="cal" id="calbar" hidden><button class="btn" id="calbtn" type="button">📅 今日の一歩を予定に追加</button></div>
  <section class="step" id="step" aria-label="予定の確認" hidden>
    <label>予定のタイトル<input id="stTitle" type="text" maxlength="60"></label>
    <div class="row">
      <label>開始<input id="stStart" type="datetime-local"></label>
      <label>長さ<select id="stMin"><option value="10">10 分</option><option value="15">15 分</option><option value="20">20 分</option><option value="30">30 分</option><option value="45">45 分</option><option value="60">60 分</option></select></label>
    </div>
    <label>メモ<input id="stNote" type="text" maxlength="200"></label>
    <div class="acts"><button class="btn" id="stAdd" type="button">Google カレンダーに追加</button><button class="ghost" id="stCancel" type="button">やめる</button></div>
    <p class="note">追加には Google ログインが必要です。予定の作成だけを許可し、ログイン情報はこのページの外には送られず、保存もされません。</p>
    <p id="stMsg" role="status" aria-live="polite"></p>
  </section>

  <form id="form">
    <textarea id="input" rows="1" maxlength="1000" placeholder="メッセージ" aria-label="メッセージ"></textarea>
    <button class="send" id="send" type="submit" aria-label="送信"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
  <div class="foot">
    <span>入力は AI（Google Gemini）に送信されます。個人情報は書かないでください。</span>
    <button class="ghost" id="reset" type="button">最初から</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script src="cat3d.js?v=4" defer></script>
<script>
  const cat = (state) => { if (window.NyaCat) window.NyaCat.setState(state); }; // 3D の猫の動き（使えないときは何もしない）
  const API_URL = "https://squiddessert.vercel.app/api/nuse";
  // Google カレンダー連携：Google Cloud で作った OAuth クライアント ID（ウェブ アプリケーション）を入れる。
  // 公開してよい値（シークレットではない）。承認済みの JavaScript 生成元に https://yusakunagano.github.io を登録済み。
  const GOOGLE_CLIENT_ID = "510064716211-d05165huruhsjrj2ktl29s6shk0fv4rp.apps.googleusercontent.com";
  const CAL_SCOPE = "https://www.googleapis.com/auth/calendar.events";
  const MAX_TURNS = 10; // API と同じ：1 つの会話で話せる回数
  const GREETING = "にゃーん、ぼくはNyaaz。ひらめきの毛糸玉をころがすのが大好きな猫だにゃ。今日あったこと、気分、気になる言葉……断片のままで大丈夫にゃ。ひとつ話しかけてみてにゃ。";
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), send = $("send");
  let messages = []; // { role: "user" | "assistant", text }
  let busy = false;

  function add(cls, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls; el.textContent = text;
    log.append(el); log.scrollTop = log.scrollHeight;
    return el;
  }
  // 返事を待つあいだ、猫が毛糸玉を追いかける
  function thinking(label) {
    const el = add("bot wait", label);
    el.setAttribute("role", "status");
    return el;
  }
  function updateCal() { $("calbar").hidden = !messages.some((m) => m.role === "assistant"); }
  function start() {
    messages = []; $("step").hidden = true; updateCal(); log.replaceChildren();
    const hero = document.createElement("div"); hero.className = "hero";
    const h1 = document.createElement("h1"); h1.className = "sr-only"; h1.textContent = "Nyaaz"; hero.append(h1); log.append(hero);
    add("bot", GREETING);
    input.disabled = false; send.disabled = false; input.value = ""; resize(); input.focus();
  }
  function resize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 128) + "px"; }
  input.addEventListener("input", resize);
  input.addEventListener("keydown", (e) => {
    // Enter で送信、Shift+Enter で改行（変換確定の Enter は除く）
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
  });
  $("reset").addEventListener("click", () => { if (!busy) start(); });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true; send.disabled = true;
    messages.push({ role: "user", text });
    add("me", text); input.value = ""; resize();
    const wait = thinking("考え中にゃ…"); cat("thinking");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "うまくいきませんでした。もう一度お試しください。");
      wait.className = "msg bot"; wait.textContent = data.reply; if (window.NyaCat) window.NyaCat.speak(data.reply);
      messages.push({ role: "assistant", text: data.reply });
      updateCal();
    } catch (err) {
      cat("idle"); wait.remove(); messages.pop(); // 答えが返らなかった発言は、履歴から外して書き直せるようにする
      input.value = text; resize();
      add("err", err.message);
    }
    busy = false; send.disabled = false;
    if (messages.filter((m) => m.role === "user").length >= MAX_TURNS) {
      add("bot", "たくさんおしゃべりできたにゃ。また新しく始めるときは、右下の「最初から」を押してにゃ。");
      input.disabled = true; send.disabled = true;
    } else input.focus();
    log.scrollTop = log.scrollHeight;
  });

  // ---------- Google カレンダーに「今日の一歩」を追加 ----------
  const pad = (n) => String(n).padStart(2, "0");
  const localValue = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const stMsg = (cls, text) => { const el = $("stMsg"); el.className = cls; el.textContent = text; return el; };

  $("calbtn").addEventListener("click", async () => {
    if (busy) return;
    busy = true; $("calbtn").disabled = true; $("step").hidden = true;
    const wait = thinking("今日の一歩を考え中にゃ…"); cat("thinking");
    try {
      const res = await fetch(API_URL, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "step", messages }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "うまくいきませんでした。もう一度お試しください。");
      const start = new Date(Date.now() + 60 * 60 * 1000); // 1 時間後の、次のきりのいい 30 分
      start.setMinutes(start.getMinutes() < 30 ? 30 : 60, 0, 0);
      $("stTitle").value = data.title; $("stNote").value = data.note;
      $("stStart").value = localValue(start); $("stMin").value = String(data.minutes <= 10 ? 10 : [15, 20, 30, 45, 60].find((m) => m >= data.minutes) || 60);
      stMsg("", ""); $("stAdd").disabled = false; $("step").hidden = false;
      $("step").scrollIntoView({ block: "nearest" });
    } catch (err) {
      add("err", err.message);
    }
    cat("idle"); wait.remove(); busy = false; $("calbtn").disabled = false;
  });
  $("stCancel").addEventListener("click", () => { $("step").hidden = true; });

  let gisPromise;
  function loadGis() {
    gisPromise ||= new Promise((resolve, reject) => {
      const el = document.createElement("script");
      el.src = "https://accounts.google.com/gsi/client"; el.async = true;
      el.onload = resolve; el.onerror = () => { gisPromise = null; reject(new Error("Google のログイン部品を読み込めませんでした")); };
      document.head.append(el);
    });
    return gisPromise;
  }
  function getToken() {
    return new Promise((resolve, reject) => {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID, scope: CAL_SCOPE,
        callback: (r) => (r.access_token ? resolve(r.access_token) : reject(new Error("Google ログインが完了しませんでした"))),
        error_callback: () => reject(new Error("Google ログインが完了しませんでした")),
      });
      client.requestAccessToken();
    });
  }

  $("stAdd").addEventListener("click", async () => {
    const title = $("stTitle").value.trim(), startValue = $("stStart").value;
    if (!title || !startValue) return stMsg("bad", "タイトルと開始の日時を入れてください");
    if (!GOOGLE_CLIENT_ID) return stMsg("bad", "Google カレンダー連携の設定がまだ終わっていません（開発中）");
    const start = new Date(startValue), end = new Date(start.getTime() + Number($("stMin").value) * 60000);
    $("stAdd").disabled = true; stMsg("", "Google にログインしています…");
    try {
      await loadGis();
      const token = await getToken();
      stMsg("", "予定を追加しています…");
      const res = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: JSON.stringify({
          summary: title,
          description: [$("stNote").value.trim(), "Nyaazのチャットから追加"].filter(Boolean).join("\n\n"),
          start: { dateTime: start.toISOString() }, end: { dateTime: end.toISOString() },
        }),
      });
      const ev = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(res.status === 403 ? "カレンダーへの書き込みが許可されませんでした" : "予定を追加できませんでした");
      const el = stMsg("ok", "追加しました。 ");
      if (/^https:\/\/(www\.)?google\.com\//.test(ev.htmlLink || "")) {
        const a = document.createElement("a"); a.href = ev.htmlLink; a.target = "_blank"; a.rel = "noopener"; a.textContent = "カレンダーで見る";
        el.append(a);
      }
    } catch (err) {
      stMsg("bad", err.message);
      $("stAdd").disabled = false;
    }
  });

  // スマホでキーボードが開くと、画面が上にずれて猫が見えなくなる。見えている範囲の高さに合わせ、いつも先頭に戻す
  if (window.visualViewport) {
    const fit = () => { document.querySelector(".app").style.height = window.visualViewport.height + "px"; window.scrollTo(0, 0); log.scrollTop = log.scrollHeight; };
    window.visualViewport.addEventListener("resize", fit);
    window.visualViewport.addEventListener("scroll", () => window.scrollTo(0, 0));
  }
  start();
</script>
</body>
</html>
