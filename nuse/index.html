<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="今日のことや気分、気になる言葉を話しかけると、AI の猫「ニャーズ」が会話でひらめきを引き出します。">
<title>ニャーズ</title>
<style>
  :root { --paper:#f7f4ef; --card:#fff; --ink:#26222d; --muted:#6b6577; --line:#e4ded4; --accent:#6a45b8; --accent-soft:#eee8fa; --on-accent:#fff; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#16131c; --card:#201c29; --ink:#eeeaf5; --muted:#a8a1b6; --line:#352f42; --accent:#b9a2f5; --accent-soft:#2b2440; --on-accent:#1a1230; --err:#ff8a80; color-scheme:dark; } }
  :root[data-theme="dark"] { --paper:#16131c; --card:#201c29; --ink:#eeeaf5; --muted:#a8a1b6; --line:#352f42; --accent:#b9a2f5; --accent-soft:#2b2440; --on-accent:#1a1230; --err:#ff8a80; color-scheme:dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; line-height:1.7; }
  .app { max-width:40rem; margin:0 auto; height:100dvh; overflow:hidden; display:flex; flex-direction:column; padding-inline:16px; }
  header { flex:none; padding-block:8px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  #cat3d { width:128px; height:128px; flex:none; margin-block:-8px; }
  #cat3d canvas { display:block; width:128px; height:128px; }
  .cat3d-on .face { display:none; }
  /* 画面が低いとき（キーボードが開いたときなど）は、猫を小さくして、いつも見えるようにする */
  @media (max-height:560px) { #cat3d, #cat3d canvas { width:76px !important; height:76px !important; } header { gap:8px; } .app .step { max-height:34dvh; } }
  .titles { display:grid; gap:2px; }
  h1 { font-size:1.5rem; margin:0; letter-spacing:.06em; display:flex; align-items:center; gap:8px; }
  .face { font-size:1.9rem; line-height:1; }
  .sub { color:var(--muted); font-size:.85rem; margin:0; }
  .moods { display:flex; gap:6px; border:0; padding:0; margin:0 0 0 auto; }
  .mood input { position:absolute; opacity:0; }
  .mood span { display:inline-block; padding:3px 12px; border:1px solid var(--line); border-radius:999px; cursor:pointer; font-size:.8rem; }
  .mood input:checked + span { background:var(--accent-soft); border-color:var(--accent); font-weight:700; }
  .mood input:focus-visible + span, .btn:focus-visible, textarea:focus-visible, .ghost:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-block:12px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg.bot::before { content:"🐱"; margin-right:6px; }
  .msg.me { align-self:flex-end; background:var(--accent); color:var(--on-accent); border-bottom-right-radius:4px; }
  .msg.err { align-self:center; color:var(--err); font-weight:700; font-size:.9rem; background:none; }
  .msg.wait::before { content:none; }
  .thinking { display:flex; align-items:center; gap:10px; font-size:.9rem; color:var(--muted); }
  .run { position:relative; width:96px; height:30px; overflow:hidden; flex:none; }
  .run span { position:absolute; bottom:0; font-size:22px; line-height:1; animation:2.2s linear infinite; }
  .run .cat { left:0; transform:scaleX(-1); animation-name:chase-cat; }
  .run .yarn { left:34px; animation-name:chase-yarn; }
  /* 猫（右向き）が毛糸玉を追いかけて走り抜ける。毛糸玉は転がり、猫は上下にはずむ */
  @keyframes chase-cat { 0% { transform:translate(-30px,0) scaleX(-1); opacity:0; } 12% { opacity:1; } 50% { transform:translate(30px,-4px) scaleX(-1); } 88% { opacity:1; } 100% { transform:translate(90px,0) scaleX(-1); opacity:0; } }
  @keyframes chase-yarn { 0% { transform:translateX(-30px) rotate(0); opacity:0; } 12% { opacity:1; } 88% { opacity:1; } 100% { transform:translateX(60px) rotate(540deg); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .run span { animation:none; opacity:1; } .run .cat { transform:translateX(30px) scaleX(-1); } .run .yarn { transform:none; } }
  form { display:flex; gap:8px; align-items:flex-end; padding-block:8px; }
  textarea { flex:1; min-width:0; max-height:8rem; padding:10px 14px; font:inherit; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); resize:none; }
  .btn { font:inherit; font-weight:700; padding:10px 20px; border-radius:12px; border:none; background:var(--accent); color:var(--on-accent); cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:default; }
  .cal { display:flex; justify-content:center; padding-bottom:4px; }
  .cal .btn { background:var(--accent-soft); color:var(--ink); font-size:.85rem; padding:6px 16px; }
  .step { flex:none; max-height:50dvh; overflow-y:auto; background:var(--card); border:1px solid var(--accent); border-radius:12px; padding:14px; display:grid; gap:10px; margin-bottom:8px; }
  .step label { display:grid; gap:2px; font-size:.8rem; color:var(--muted); font-weight:700; }
  .step input, .step select { font:inherit; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:6px 10px; min-width:0; }
  .step .row { display:grid; grid-template-columns:1fr auto; gap:8px; }
  .step .acts { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .step .btn { padding:8px 16px; }
  .step .note { font-size:.75rem; color:var(--muted); margin:0; }
  .step .ok { color:var(--accent); font-weight:700; margin:0; }
  .step .ok a { color:inherit; }
  .step p:empty { display:none; }
  .step .bad { color:var(--err); font-weight:700; margin:0; font-size:.85rem; }
  .foot { display:flex; justify-content:space-between; gap:12px; font-size:.78rem; color:var(--muted); padding-bottom:max(10px, env(safe-area-inset-bottom)); }
  .ghost { font:inherit; font-size:.78rem; background:none; border:none; color:var(--muted); cursor:pointer; padding:0; text-decoration:underline; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div id="cat3d"></div>
    <div class="titles">
      <h1><span class="face" aria-hidden="true">🐱</span>ニャーズ</h1>
      <p class="sub">ひらめきの相棒の猫</p>
    </div>
    <fieldset class="moods" aria-label="トーン">
      <label class="mood"><input type="radio" name="mood" value="gentle" checked><span>やさしく</span></label>
      <label class="mood"><input type="radio" name="mood" value="bold"><span>大胆に</span></label>
      <label class="mood"><input type="radio" name="mood" value="playful"><span>遊び心</span></label>
    </fieldset>
  </header>

  <div id="log" role="log" aria-live="polite"></div>

  <div class="cal" id="calbar" hidden><button class="btn" id="calbtn" type="button">📅 今日の一歩を予定に追加</button></div>
  <section class="step" id="step" aria-label="予定の確認" hidden>
    <label>予定のタイトル<input id="stTitle" type="text" maxlength="60"></label>
    <div class="row">
      <label>開始<input id="stStart" type="datetime-local"></label>
      <label>長さ<select id="stMin"><option value="10">10 分</option><option value="15">15 分</option><option value="20">20 分</option><option value="30">30 分</option><option value="45">45 分</option><option value="60">60 分</option></select></label>
    </div>
    <label>メモ<input id="stNote" type="text" maxlength="200"></label>
    <div class="acts"><button class="btn" id="stAdd" type="button">Google カレンダーに追加</button><button class="ghost" id="stCancel" type="button">やめる</button></div>
    <p class="note">追加には Google ログインが必要です。予定の作成だけを許可し、ログイン情報はこのページの外には送られず、保存もされません。</p>
    <p id="stMsg" role="status" aria-live="polite"></p>
  </section>

  <form id="form">
    <textarea id="input" rows="1" maxlength="1000" placeholder="ニャーズに話しかける…（今日のこと、気分、言葉）" aria-label="メッセージ"></textarea>
    <button class="btn" id="send" type="submit">送信</button>
  </form>
  <div class="foot">
    <span>入力は AI（Google Gemini）に送信されます。個人情報は書かないでください。</span>
    <button class="ghost" id="reset" type="button">最初から</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
<script src="cat3d.js?v=2" defer></script>
<script>
  const cat = (state) => { if (window.NyaCat) window.NyaCat.setState(state); }; // 3D の猫の動き（使えないときは何もしない）
  const API_URL = "https://squiddessert.vercel.app/api/nuse";
  // Google カレンダー連携：Google Cloud で作った OAuth クライアント ID（ウェブ アプリケーション）を入れる。
  // 公開してよい値（シークレットではない）。承認済みの JavaScript 生成元に https://yusakunagano.github.io を登録する。
  const GOOGLE_CLIENT_ID = "";
  const CAL_SCOPE = "https://www.googleapis.com/auth/calendar.events";
  const MAX_TURNS = 10; // API と同じ：1 つの会話で話せる回数
  const GREETING = "にゃーん、ぼくはニャーズ。ひらめきの毛糸玉をころがすのが大好きな猫だにゃ。今日あったこと、気分、気になる言葉……断片のままで大丈夫にゃ。ひとつ話しかけてみてにゃ。";
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), send = $("send");
  let messages = []; // { role: "user" | "assistant", text }
  let busy = false;

  function add(cls, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls; el.textContent = text;
    log.append(el); log.scrollTop = log.scrollHeight;
    return el;
  }
  // 返事を待つあいだ、猫が毛糸玉を追いかける
  function thinking(label) {
    const el = add("bot wait", "");
    el.innerHTML = '<div class="thinking" role="status"><span class="run" aria-hidden="true"><span class="yarn">🧶</span><span class="cat">🐈</span></span><span></span></div>';
    el.querySelector(".thinking > span:last-child").textContent = label;
    log.scrollTop = log.scrollHeight;
    return el;
  }
  function updateCal() { $("calbar").hidden = !messages.some((m) => m.role === "assistant"); }
  function start() {
    messages = []; $("step").hidden = true; updateCal(); log.replaceChildren(); add("bot", GREETING);
    input.disabled = false; send.disabled = false; input.value = ""; resize(); input.focus();
  }
  function resize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 128) + "px"; }
  input.addEventListener("input", resize);
  input.addEventListener("keydown", (e) => {
    // Enter で送信、Shift+Enter で改行（変換確定の Enter は除く）
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
  });
  $("reset").addEventListener("click", () => { if (!busy) start(); });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true; send.disabled = true;
    messages.push({ role: "user", text });
    add("me", text); input.value = ""; resize();
    const wait = thinking("考え中にゃ…"); cat("thinking");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages, mood: document.querySelector("input[name=mood]:checked").value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "うまくいきませんでした。もう一度お試しください。");
      wait.className = "msg bot"; wait.textContent = data.reply; if (window.NyaCat) window.NyaCat.speak(data.reply);
      messages.push({ role: "assistant", text: data.reply });
      updateCal();
    } catch (err) {
      cat("idle"); wait.remove(); messages.pop(); // 答えが返らなかった発言は、履歴から外して書き直せるようにする
      input.value = text; resize();
      add("err", err.message);
    }
    busy = false; send.disabled = false;
    if (messages.filter((m) => m.role === "user").length >= MAX_TURNS) {
      add("bot", "たくさんおしゃべりできたにゃ。また新しく始めるときは、右下の「最初から」を押してにゃ。");
      input.disabled = true; send.disabled = true;
    } else input.focus();
    log.scrollTop = log.scrollHeight;
  });

  // ---------- Google カレンダーに「今日の一歩」を追加 ----------
  const pad = (n) => String(n).padStart(2, "0");
  const localValue = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const stMsg = (cls, text) => { const el = $("stMsg"); el.className = cls; el.textContent = text; return el; };

  $("calbtn").addEventListener("click", async () => {
    if (busy) return;
    busy = true; $("calbtn").disabled = true; $("step").hidden = true;
    const wait = thinking("今日の一歩を考え中にゃ…"); cat("thinking");
    try {
      const res = await fetch(API_URL, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "step", messages }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "うまくいきませんでした。もう一度お試しください。");
      const start = new Date(Date.now() + 60 * 60 * 1000); // 1 時間後の、次のきりのいい 30 分
      start.setMinutes(start.getMinutes() < 30 ? 30 : 60, 0, 0);
      $("stTitle").value = data.title; $("stNote").value = data.note;
      $("stStart").value = localValue(start); $("stMin").value = String(data.minutes <= 10 ? 10 : [15, 20, 30, 45, 60].find((m) => m >= data.minutes) || 60);
      stMsg("", ""); $("stAdd").disabled = false; $("step").hidden = false;
      $("step").scrollIntoView({ block: "nearest" });
    } catch (err) {
      add("err", err.message);
    }
    cat("idle"); wait.remove(); busy = false; $("calbtn").disabled = false;
  });
  $("stCancel").addEventListener("click", () => { $("step").hidden = true; });

  let gisPromise;
  function loadGis() {
    gisPromise ||= new Promise((resolve, reject) => {
      const el = document.createElement("script");
      el.src = "https://accounts.google.com/gsi/client"; el.async = true;
      el.onload = resolve; el.onerror = () => { gisPromise = null; reject(new Error("Google のログイン部品を読み込めませんでした")); };
      document.head.append(el);
    });
    return gisPromise;
  }
  function getToken() {
    return new Promise((resolve, reject) => {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID, scope: CAL_SCOPE,
        callback: (r) => (r.access_token ? resolve(r.access_token) : reject(new Error("Google ログインが完了しませんでした"))),
        error_callback: () => reject(new Error("Google ログインが完了しませんでした")),
      });
      client.requestAccessToken();
    });
  }

  $("stAdd").addEventListener("click", async () => {
    const title = $("stTitle").value.trim(), startValue = $("stStart").value;
    if (!title || !startValue) return stMsg("bad", "タイトルと開始の日時を入れてください");
    if (!GOOGLE_CLIENT_ID) return stMsg("bad", "Google カレンダー連携の設定がまだ終わっていません（開発中）");
    const start = new Date(startValue), end = new Date(start.getTime() + Number($("stMin").value) * 60000);
    $("stAdd").disabled = true; stMsg("", "Google にログインしています…");
    try {
      await loadGis();
      const token = await getToken();
      stMsg("", "予定を追加しています…");
      const res = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
        body: JSON.stringify({
          summary: title,
          description: [$("stNote").value.trim(), "ニャーズのチャットから追加"].filter(Boolean).join("\n\n"),
          start: { dateTime: start.toISOString() }, end: { dateTime: end.toISOString() },
        }),
      });
      const ev = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(res.status === 403 ? "カレンダーへの書き込みが許可されませんでした" : "予定を追加できませんでした");
      const el = stMsg("ok", "追加しました。 ");
      if (/^https:\/\/(www\.)?google\.com\//.test(ev.htmlLink || "")) {
        const a = document.createElement("a"); a.href = ev.htmlLink; a.target = "_blank"; a.rel = "noopener"; a.textContent = "カレンダーで見る";
        el.append(a);
      }
    } catch (err) {
      stMsg("bad", err.message);
      $("stAdd").disabled = false;
    }
  });

  // スマホでキーボードが開くと、画面が上にずれて猫が見えなくなる。見えている範囲の高さに合わせ、いつも先頭に戻す
  if (window.visualViewport) {
    const fit = () => { document.querySelector(".app").style.height = window.visualViewport.height + "px"; window.scrollTo(0, 0); log.scrollTop = log.scrollHeight; };
    window.visualViewport.addEventListener("resize", fit);
    window.visualViewport.addEventListener("scroll", () => window.scrollTo(0, 0));
  }
  start();
</script>
</body>
</html>
