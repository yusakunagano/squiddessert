<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="今日のことや気分、気になる言葉を話しかけると、AI の nuse が会話でひらめきを引き出します。">
<title>nuse</title>
<style>
  :root { --paper:#f7f4ef; --card:#fff; --ink:#26222d; --muted:#6b6577; --line:#e4ded4; --accent:#6a45b8; --accent-soft:#eee8fa; --on-accent:#fff; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#16131c; --card:#201c29; --ink:#eeeaf5; --muted:#a8a1b6; --line:#352f42; --accent:#b9a2f5; --accent-soft:#2b2440; --on-accent:#1a1230; --err:#ff8a80; color-scheme:dark; } }
  :root[data-theme="dark"] { --paper:#16131c; --card:#201c29; --ink:#eeeaf5; --muted:#a8a1b6; --line:#352f42; --accent:#b9a2f5; --accent-soft:#2b2440; --on-accent:#1a1230; --err:#ff8a80; color-scheme:dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; line-height:1.7; }
  .app { max-width:40rem; margin:0 auto; height:100dvh; display:flex; flex-direction:column; padding-inline:16px; }
  header { padding-block:16px 8px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:1.6rem; margin:0; letter-spacing:.08em; }
  .sub { color:var(--muted); font-size:.85rem; margin:0; }
  .moods { display:flex; gap:6px; border:0; padding:0; margin:0 0 0 auto; }
  .mood input { position:absolute; opacity:0; }
  .mood span { display:inline-block; padding:3px 12px; border:1px solid var(--line); border-radius:999px; cursor:pointer; font-size:.8rem; }
  .mood input:checked + span { background:var(--accent-soft); border-color:var(--accent); font-weight:700; }
  .mood input:focus-visible + span, .btn:focus-visible, textarea:focus-visible, .ghost:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-block:12px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .msg.me { align-self:flex-end; background:var(--accent); color:var(--on-accent); border-bottom-right-radius:4px; }
  .msg.err { align-self:center; color:var(--err); font-weight:700; font-size:.9rem; background:none; }
  .typing { display:inline-flex; gap:5px; }
  .typing i { width:7px; height:7px; border-radius:50%; background:var(--muted); animation:bob 1s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay:.15s; } .typing i:nth-child(3) { animation-delay:.3s; }
  @keyframes bob { 50% { transform:translateY(-5px); opacity:.5; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation:none; } }
  form { display:flex; gap:8px; align-items:flex-end; padding-block:8px; }
  textarea { flex:1; min-width:0; max-height:8rem; padding:10px 14px; font:inherit; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); resize:none; }
  .btn { font:inherit; font-weight:700; padding:10px 20px; border-radius:12px; border:none; background:var(--accent); color:var(--on-accent); cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:default; }
  .foot { display:flex; justify-content:space-between; gap:12px; font-size:.78rem; color:var(--muted); padding-bottom:max(10px, env(safe-area-inset-bottom)); }
  .ghost { font:inherit; font-size:.78rem; background:none; border:none; color:var(--muted); cursor:pointer; padding:0; text-decoration:underline; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>nuse</h1>
    <p class="sub">ひらめきの相棒</p>
    <fieldset class="moods" aria-label="トーン">
      <label class="mood"><input type="radio" name="mood" value="gentle" checked><span>やさしく</span></label>
      <label class="mood"><input type="radio" name="mood" value="bold"><span>大胆に</span></label>
      <label class="mood"><input type="radio" name="mood" value="playful"><span>遊び心</span></label>
    </fieldset>
  </header>

  <div id="log" role="log" aria-live="polite"></div>

  <form id="form">
    <textarea id="input" rows="1" maxlength="1000" placeholder="今日のこと、気分、気になる言葉…" aria-label="メッセージ"></textarea>
    <button class="btn" id="send" type="submit">送信</button>
  </form>
  <div class="foot">
    <span>入力は AI（Google Gemini）に送信されます。個人情報は書かないでください。</span>
    <button class="ghost" id="reset" type="button">最初から</button>
  </div>
</div>
<script>
  const API_URL = "https://squiddessert.vercel.app/api/nuse";
  const MAX_TURNS = 10; // API と同じ：1 つの会話で話せる回数
  const GREETING = "こんにちは、nuse です。今日あったこと、気分、気になる言葉……断片のままで大丈夫。ひとつ話しかけてみてください。";
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), send = $("send");
  let messages = []; // { role: "user" | "assistant", text }
  let busy = false;

  function add(cls, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls; el.textContent = text;
    log.append(el); log.scrollTop = log.scrollHeight;
    return el;
  }
  function start() {
    messages = []; log.replaceChildren(); add("bot", GREETING);
    input.disabled = false; send.disabled = false; input.value = ""; resize(); input.focus();
  }
  function resize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 128) + "px"; }
  input.addEventListener("input", resize);
  input.addEventListener("keydown", (e) => {
    // Enter で送信、Shift+Enter で改行（変換確定の Enter は除く）
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
  });
  $("reset").addEventListener("click", () => { if (!busy) start(); });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true; send.disabled = true;
    messages.push({ role: "user", text });
    add("me", text); input.value = ""; resize();
    const wait = add("bot", ""); wait.innerHTML = '<span class="typing" aria-label="考え中"><i></i><i></i><i></i></span>';
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages, mood: document.querySelector("input[name=mood]:checked").value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "うまくいきませんでした。もう一度お試しください。");
      wait.textContent = data.reply;
      messages.push({ role: "assistant", text: data.reply });
    } catch (err) {
      wait.remove(); messages.pop(); // 答えが返らなかった発言は、履歴から外して書き直せるようにする
      input.value = text; resize();
      add("err", err.message);
    }
    busy = false; send.disabled = false;
    if (messages.filter((m) => m.role === "user").length >= MAX_TURNS) {
      add("bot", "たくさん話せました。新しく始めるときは、右下の「最初から」を押してください。");
      input.disabled = true; send.disabled = true;
    } else input.focus();
    log.scrollTop = log.scrollHeight;
  });
  start();
</script>
</body>
</html>
