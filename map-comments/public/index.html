<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マップコメント</title>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js"
      }
    }
  </script>
</head>
<body>
  <header class="bar">
    <h1>マップコメント</h1>
    <div id="search" class="search" hidden></div>
    <p class="hint">地図をクリックしてコメント。<span id="rule"></span></p>
  </header>
  <main class="main">
    <div id="map"></div>
    <aside id="timeline" aria-label="コメント一覧">
      <div class="tl-head">
        <h2>みんなのコメント <small>新しい順</small></h2>
        <button type="button" id="tlClose" class="tl-close" aria-label="一覧を閉じる">×</button>
      </div>
      <ol id="tlList" class="tl-list"></ol>
      <p id="tlEmpty" class="tl-empty">まだコメントはありません</p>
    </aside>
  </main>
  <button type="button" id="tlOpen" class="tl-open">コメント一覧</button>
  <div id="notice" hidden>引いた地図では、各エリアの最新コメントを表示しています</div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
