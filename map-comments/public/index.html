<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マップコメント</title>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js"
      }
    }
  </script>
</head>
<body>
  <header class="bar">
    <h1>マップコメント</h1>
    <p class="hint">地図をクリックしてコメント。<span id="rule"></span></p>
  </header>
  <div id="map"></div>
  <div id="notice" hidden>ズームするとコメントが見えます</div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
