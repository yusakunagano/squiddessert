<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>利用サービス（プロトタイプ）</title>
<link rel="stylesheet" href="app.css">
<style>
  main { padding: 16px; }
  .intro { font-size: 13px; color: var(--sub); margin: 0 0 12px; line-height: 1.6; }
  .svc { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .svc .tag { font-size: 11px; color: var(--brand); font-weight: 700; }
  .svc h2 { font-size: 16px; margin: 4px 0 8px; }
  .svc .fine { font-size: 11px; color: var(--sub); line-height: 1.7; }
  .svc .ask { margin-top: 10px; width: 100%; padding: 10px; border-radius: 20px; border: 1px solid var(--brand); background: #fff; color: var(--brand); font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<script src="gate.js"></script>
<div class="app slide-in">
  <div class="proto">※ UIプロトタイプです。特典は公開情報（2026年時点）を参考にした例です</div>
  <header><a href="index.html" aria-label="戻る">‹</a><h1>利用サービス</h1><span style="width:20px"></span></header>
  <main>
    <p class="intro">ご利用中のサービスと特典です。条件が分かりにくいときは、各サービスの「AIでかんたん解説」か右下のAIに聞いてください。</p>
    <div id="list"></div>
  </main>
</div>
<script src="chat.js"></script>
<script>
// Based on public info about the partner bank's 2026 rank program (5 ranks, free ATM / transfer counts).
// Rank thresholds are not public in our sources, so RANK_RULES below are illustrative only.
const RANKS = [
  { name: 'プラチナVIP', atm: 20, tr: 20 },
  { name: 'VIP',         atm: 15, tr: 15 },
  { name: 'ゴールド',     atm: 10, tr: 10 },
  { name: 'シルバー',     atm: 5,  tr: 5 },
  { name: 'ベーシック',   atm: 1,  tr: 2 },
];
const TRANSFER_FEE = 77; // per extra transfer to other banks (税込)

const BENEFITS = [
  { id: 'rank', tag: '銀行', name: 'ランク別の優遇（5段階）',
    fine: 'お取引状況に応じて「ベーシック」「シルバー」「ゴールド」「VIP」「プラチナVIP」の5段階のランクを判定し、ランクに応じてATM利用手数料・他行宛振込手数料の無料回数、デビットカードのポイント還元率等を優遇。プラチナVIP：ATM・他行振込 各月20回、VIP：各15回、ゴールド：各10回、シルバー：各5回、ベーシック：ATM月1回・他行振込月2回。同行および提携信託銀行宛の振込は回数無制限で無料。無料回数を超えた他行宛振込は1件77円（税込）。',
    plain: ['ランクは5段階。上がるほどATMと振込の無料回数が増える', 'いちばん上なら、ATMも他行への振込も月20回まで無料', '同じ銀行あての振込はいつでも無料', '無料回数を超えた他行振込は1回77円'],
    entry: false },
  { id: 'judge', tag: '銀行', name: 'ランクの決まり方',
    fine: 'ランクは判定対象月の円普通預金・ハイブリッド預金の残高、または給与・年金の受取、口座振替等のお取引状況により判定し、判定対象月の翌々月（ランク適用月）に適用。口座開設直後は所定の期間「シルバー」を適用。2026年5月の改定により、一部の判定条件（スマート認証NEOの登録による優遇等）は廃止。',
    plain: ['預金の残高や、給与の受け取り・口座振替などの使い方でランクが決まる', '今月の使い方が反映されるのは「再来月」', '口座を作ってしばらくはシルバー', '2026年5月から、アプリ認証の登録だけで優遇される条件はなくなった'],
    entry: false },
  { id: 'debit', tag: 'デビット', name: 'デビットカードのポイント',
    fine: '対象のデビットカード（プラチナデビットカード、デビットカード ポイント＋）のご利用で、ランクに応じたポイント還元率を適用。銀行独自のポイントはデビットカードのお支払い等に利用可能。還元率・対象取引の詳細は商品ページをご確認ください。',
    plain: ['対象のデビットカードで払うとポイントが貯まる', 'ランクが高いほど還元率アップ', '貯まったポイントはデビットの支払いに使える'],
    entry: false },
  { id: 'dpoint', tag: '連携', name: 'ポイント連携',
    fine: '2026年8月20日より、決済アプリの共通ポイントとの連携を開始。連携には双方のアカウント連携（エントリー）が必要。付与条件・対象取引は今後順次拡大予定。',
    plain: ['銀行の使い方で、アプリの共通ポイントも貯まるようになった（2026年8月20日〜）', 'アカウントの連携（エントリー）が必要', '条件はまだ増えていく予定'],
    entry: true },
];

document.getElementById('list').innerHTML = BENEFITS.map(b => `
  <section class="svc">
    <span class="tag">${b.tag}</span><h2>${b.name}</h2>
    <p class="fine">${b.fine}</p>
    ${b.id === 'rank' ? `<div class="data" style="margin-top:8px"><div class="h"><span>ランク</span><span>ATM / 他行振込（月）</span></div>${RANKS.map(r => `<div><span>${r.name}</span><b>${r.atm}回 / ${r.tr}回</b></div>`).join('')}</div>` : ''}
    <button class="ask" data-id="${b.id}">🤖 AIでかんたん解説</button>
  </section>`).join('');

const DEFAULT_CHIPS = ['私は何ランク？', '無料回数で足りる？', 'ランクを上げるには？', 'エントリーが必要なのは？'];

function explain(b, chat) {
  chat.ai(`「${b.name}」をかんたんに言うと：\n\n${b.plain.map(s => '・' + s).join('\n')}${b.entry ? '\n\n⚠️ エントリー（連携）しないと対象になりません。' : ''}`);
  chat.chips(DEFAULT_CHIPS);
}

// Illustrative thresholds (not the bank's real rules).
function rankFor(ans) {
  const bal = { '10万円未満': 0, '10万〜100万円': 1, '100万〜300万円': 2, '300万円以上': 3 }[ans.balance];
  const salary = ans.salary === 'はい';
  if (bal >= 3 && salary) return RANKS[0];
  if (bal >= 3 || (bal >= 2 && salary)) return RANKS[1];
  if (bal >= 2 || salary) return RANKS[2];
  if (bal >= 1) return RANKS[3];
  return RANKS[4];
}

// The AI asks only what the account data can't tell it.
function hearAll(chat, done) {
  hear(chat, 'いくつか教えてください。\n① 普通預金の残高はどのくらいですか？', ['10万円未満', '10万〜100万円', '100万〜300万円', '300万円以上'], balance =>
    hear(chat, '② 給与や年金をこの口座で受け取っていますか？', ['はい', 'いいえ'], salary =>
      hear(chat, '③ 他の銀行への振込は月に何回くらいですか？', ['0〜2回', '3〜5回', '6〜10回', '11回以上'], tr =>
        done({ balance, salary, tr: { '0〜2回': 2, '3〜5回': 5, '6〜10回': 10, '11回以上': 15 }[tr] }))));
}

function showRank(chat, ans) {
  const r = rankFor(ans);
  const over = Math.max(0, ans.tr - r.tr);
  chat.card(`<div class="data"><div class="h"><span>あなたのランク（目安）</span><b>${r.name}</b></div>
    <div><span>ATM無料</span><b>月${r.atm}回</b></div><div><span>他行振込無料</span><b>月${r.tr}回</b></div>
    <div><span>あなたの他行振込</span><b>月${ans.tr}回くらい</b></div>
    <div><span>はみ出す手数料</span><b>${over ? yen(over * TRANSFER_FEE) + '／月' : 'なし'}</b></div></div>`);
  chat.ai('※ ランクの判定条件は例示です。実際の判定は「スマートプログラム」の最新の条件をご確認ください。');
  return { r, over };
}

const chat = createChat({
  title: '特典AIサポート',
  greet: () => ({ text: 'ランクや手数料無料回数など、わかりにくい特典をかんたんにお伝えします。\nあなたに合わせた判定は、許可をいただいてから行います。', chips: DEFAULT_CHIPS }),
  handle(q, chat) {
    const b = BENEFITS.find(b => q.includes(b.name));
    if (/何ランク|私のランク|足りる|上げる|上がる/.test(q)) {
      return withConsent(chat, ['history'], () => hearAll(chat, ans => {
        const { r, over } = showRank(chat, ans);
        const i = RANKS.indexOf(r);
        if (/上げ|上が/.test(q) || over) {
          chat.ai(i === 0 ? 'すでに最上位のプラチナVIPです。' :
            `「${RANKS[i - 1].name}」に上げると、無料回数が月${RANKS[i - 1].tr}回に増えます。\n${ans.salary === 'いいえ' ? '給与の受け取り口座をこの銀行にするのが、いちばん手軽な上げ方です。' : '預金残高を増やすと上がります。'}\n反映されるのは再来月なので、早めの切り替えがおすすめです。`);
        } else chat.ai(`今の使い方なら、無料回数で足りています。`);
        chat.chips(DEFAULT_CHIPS);
      }));
    }
    if (b) return explain(b, chat);
    if (q.includes('エントリー')) chat.ai('エントリー（連携）が必要なのは「ポイント連携」です。\nランクの優遇はエントリー不要で、毎月自動で判定されます。');
    else if (/いつ|反映|翌々月|再来月/.test(q)) chat.ai('ランクは、ある月の使い方を見て「再来月」に反映されます。\n例：10月の残高・取引 → 12月のランクに反映');
    else if (/手数料|77/.test(q)) chat.ai(`無料回数を超えた他行への振込は、1回${TRANSFER_FEE}円です。同じ銀行あての振込は何回でも無料です。`);
    else chat.ai('すみません、うまく理解できませんでした。「ランク」「無料回数」「エントリー」などで聞いてみてください。');
    chat.chips(DEFAULT_CHIPS);
  },
});

document.querySelectorAll('.ask').forEach(btn => btn.onclick = () => {
  chat.open();
  const b = BENEFITS.find(x => x.id === btn.dataset.id);
  chat.me(`「${b.name}」を解説して`);
  chat.later(() => explain(b, chat));
});
</script>
</body>
</html>
