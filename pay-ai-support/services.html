<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>利用サービス（プロトタイプ）</title>
<link rel="stylesheet" href="app.css">
<style>
  :root { --page: #efedeb; --mint: #e8f6ee; --check: #2bb36a; --red: #c80000; }
  body { background: var(--page); }
  .app { background: var(--page); padding: 0 16px 120px; }
  .close-x { display: block; margin-left: auto; padding: 24px 0 8px; width: 32px; font-size: 28px; color: #444; text-decoration: none; text-align: right; }
  .tabs { display: flex; gap: 6px; margin: 16px 0 28px; }
  .tabs button { flex: 1; padding: 14px; border-radius: 28px; border: 0; font-size: 16px; font-weight: 700; background: #fafafa; color: #777; cursor: pointer; }
  .tabs button.on { background: var(--red); color: #fff; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 12px; }
  .sec h2 { font-size: 26px; margin: 0; }
  .sec .max { font-size: 13px; font-weight: 700; color: #444; }
  .sec .max b { font-size: 30px; }
  .rows { border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 16px; background: #fff; border: 0; width: 100%; text-align: left; font-size: 15px; font-weight: 700; color: #333; cursor: pointer; }
  .row.on { background: var(--mint); }
  .row .ic { width: 20px; text-align: center; color: var(--check); }
  .row .ic.n { width: 18px; height: 18px; border-radius: 50%; background: var(--red); color: #fff; font-size: 10px; line-height: 18px; }
  .row .nm { flex: 1; }
  .row .rt { font-size: 20px; }
  .row .rt small { font-size: 11px; }
  .row.off .rt { color: #ccc; }
  .row .chev { color: #555; }
  .box { background: #fff; border-radius: 14px; margin-top: 14px; }
  .box .line { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px; font-weight: 700; color: #333; }
  .box .line + .line { border-top: 1px solid #eee; }
  .box .v { font-size: 26px; text-align: right; }
  .box .v small { font-size: 13px; }
  .box .v .up { display: block; font-size: 14px; color: var(--check); }
  .up-ai { display: block; width: 100%; margin-top: 10px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--red); background: #fff; color: var(--red); font-size: 13px; font-weight: 700; text-align: left; cursor: pointer; }
  .hist .line { font-weight: 400; font-size: 14px; }
  /* detail sheet */
  .detail { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 15; }
  .detail.open { display: block; }
  .detail .panel { position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 420px; background: #fff; border-radius: 16px 16px 0 0; padding: 20px 16px 28px; max-height: 80vh; overflow-y: auto; }
  .detail h3 { margin: 0 0 4px; } .detail .fine { font-size: 12px; color: #666; line-height: 1.8; }
  .detail .ask { width: 100%; margin-top: 12px; padding: 12px; border-radius: 22px; border: 1px solid var(--brand); background: #fff; color: var(--brand); font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<script src="gate.js"></script>
<div class="app slide-in">
  <div class="proto">※ UIプロトタイプです。特典は公開情報（2026年時点）を参考にした例です</div>
  <a class="close-x" href="index.html" aria-label="閉じる">✕</a>
  <div class="tabs"><button data-tab="hist">利用履歴</button><button data-tab="svc" class="on">利用サービス</button></div>

  <div id="svc">
    <div class="sec"><h2>Pay</h2><span class="max">最大<b id="now"></b> / <span id="pot"></span>%還元</span></div>
    <div class="rows" id="rows"></div>
    <div class="box"><div class="line"><span>今月の利用総額</span><span class="v" id="total"></span></div></div>
    <button class="up-ai" id="upAi">🤖 あと <b id="gap"></b> 倍率を上げられます。AIに上げ方を聞く ›</button>
    <div class="sec" style="margin-top:32px"><h2>ポイント</h2></div>
    <div class="box">
      <div class="line"><span>保有ポイント</span><span class="v">8<small>P</small></span></div>
      <div class="line"><span>運用ポイント</span><span class="v">86,055<small>P</small><span class="up">+3,434P</span></span></div>
    </div>
  </div>
  <div id="hist" hidden><div class="box hist" id="histList"></div></div>
</div>
<div class="detail" id="detail"><div class="panel" id="panel"></div></div>

<script src="chat.js"></script>
<script>
const MONTH_TOTAL = 47140;

// Structure follows the app's 利用サービス screen. Rates/conditions come from public info (2026);
// rows marked `unverified` could not be confirmed from official pages and are approximations.
const BENEFITS = [
  { id: 'pay', name: 'Pay', rate: 0.5, on: true, cap: null,
    fine: 'アプリ払いのご利用で、200円（税込）ごとに1ポイント（0.5%）進呈。',
    plain: ['アプリで払うだけで0.5%', 'エントリーなどは不要'] },
  { id: 'card', name: 'Payカード', rate: 0.5, on: true, cap: null,
    fine: 'アプリ払いのお支払い方法をPayカードに設定すると、カードのご利用分としてさらにポイントを進呈。2027年1月ご利用分より、一部カードの通常還元率が変更になります。',
    plain: ['支払い方法をカードにすると、さらに＋0.5%', '2027年1月から一部カードの還元率が変わる予定'] },
  { id: 'rank', name: 'ランク特典', rate: 1, on: true, cap: 200,
    fine: 'ポイントクラブのランクに応じて、アプリ払いのご利用額に対し還元率を上乗せ。2026年9月1日より、毎月の進呈上限はランクにかかわらず一律200ポイント。',
    plain: ['ランクに応じて＋1%', 'ただし毎月もらえるのは200ポイントまで（2026年9月〜）', '＝ 月2万円を超える分には付かない'] },
  { id: 'bank', name: 'Payカード×提携銀行', rate: 2, on: false, cap: 3000, max: true,
    fine: 'Payカードの引き落とし口座を提携銀行に設定し、アカウント連携のうえ引き落とし実績がある場合、スマホ決済のご利用分に＋2.0%を進呈（進呈上限：月3,000ポイント）。対象は初回引き落とし月から12か月間。13か月目以降は、前々月16日〜前月15日のカードご利用額とカードの種類に応じて還元率が変動（PLATINUMで月50万円以上のご利用時2.0%、GOLD／GOLD Uは最大1.0%、一般カードは0.25%）。対象支店・対象カードに限ります。',
    plain: ['カードの引き落とし口座を提携銀行にすると＋2%（最初の12か月）', '必要なのは「口座開設」「アカウント連携」「引き落とし口座の変更」「1回の引き落とし」', 'もらえるのは月3,000ポイントまで', '13か月目からは、カードの種類と利用額で0.25〜2%に変わる'] },
  { id: 'sec', name: 'Payカード×提携証券', rate: 1.5, on: true, cap: null, unverified: true,
    fine: '提携証券の口座とPayカードを連携し、所定の条件（カード積立等）を満たすと、カードのご利用分に最大1.5%を上乗せ。条件の詳細は提携証券のページをご確認ください。',
    plain: ['証券口座とカードを連携すると最大＋1.5%', '積立などの条件あり（詳しくは証券会社のページで確認）'] },
  { id: 'poikatsu', name: 'ポイ活プラン', rate: 5, rate2: 10, on: true, cap: 2500, unverified: true,
    fine: '対象の料金プランご契約で、アプリ払い・カード払いのご利用に対し最大5%（一部対象店舗・期間は10%）を期間・用途限定ポイントで進呈（進呈上限あり）。2026年12月ご利用分より、対象決済の進呈分を差し引いた金額が計算対象になります。',
    plain: ['対象プランに入っていると最大5%（一部のお店や期間は10%）', 'もらえるのは期間・用途限定ポイント。上限あり', '2026年12月から計算方法が変わる予定'] },
];

const fmt = n => (Math.round(n * 10) / 10).toString();
const pt = n => Math.floor(n).toLocaleString('ja-JP') + 'pt';
const nowMax = BENEFITS.filter(b => b.on).reduce((a, b) => a + b.rate, 0);
const potMax = BENEFITS.reduce((a, b) => a + (b.rate2 || b.rate), 0);
document.getElementById('now').textContent = fmt(nowMax);
document.getElementById('pot').textContent = fmt(potMax);
document.getElementById('total').innerHTML = `${MONTH_TOTAL.toLocaleString()}<small>円</small>`;
document.getElementById('rows').innerHTML = BENEFITS.map(b => `
  <button class="row ${b.on ? 'on' : 'off'}" data-id="${b.id}">
    <span class="ic ${b.on ? '' : 'n'}">${b.on ? '✓' : 'N'}</span><span class="nm">${b.name}</span>
    <span class="rt">${b.max ? '<small>最大</small>' : ''}${fmt(b.rate)}${b.rate2 ? '/' + b.rate2 : ''}<small>%</small></span><span class="chev">›</span>
  </button>`).join('');

// Tabs
document.querySelectorAll('.tabs button').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === t));
  document.getElementById('svc').hidden = t.dataset.tab !== 'svc';
  document.getElementById('hist').hidden = t.dataset.tab !== 'hist';
});
document.getElementById('histList').innerHTML = USER.recent.map(r => `<div class="line"><span>${r[0]} ${r[1]}<br><small style="color:#888">${r[2]}</small></span><b>${yen(r[3])}</b></div>`).join('');

// Detail sheet per benefit
const detail = document.getElementById('detail');
detail.onclick = e => { if (e.target === detail) detail.classList.remove('open'); };
document.querySelectorAll('.row').forEach(r => r.onclick = () => {
  const b = BENEFITS.find(x => x.id === r.dataset.id);
  document.getElementById('panel').innerHTML = `<h3>${b.name}</h3>
    <div style="font-size:13px;margin-bottom:8px">${b.on ? '✅ 適用中' : '⚪ 未適用'}・${b.max ? '最大' : ''}${fmt(b.rate)}${b.rate2 ? '/' + b.rate2 : ''}%${b.cap ? `（上限 月${b.cap.toLocaleString()}pt）` : ''}</div>
    <p class="fine">${b.fine}</p>
    <button class="ask">🤖 ${b.on ? 'AIでかんたん解説' : 'この特典で倍率を上げる方法をAIに聞く'}</button>`;
  detail.classList.add('open');
  document.querySelector('#panel .ask').onclick = () => {
    detail.classList.remove('open'); chat.open();
    if (b.on) { chat.me(`「${b.name}」を解説して`); chat.later(() => explain(b, chat)); }
    else chat.ask(`${b.name}で倍率を上げるには？`);
  };
});

// ---------- AI: how to raise the rate ----------
const DEFAULT_CHIPS = ['倍率を上げるには？', 'いちばん簡単に上げる方法は？', '15.5%にするには？', '上限で頭打ちになっていない？'];
document.getElementById('gap').textContent = `+${fmt(potMax - nowMax)}%`;

function explain(b, chat) {
  chat.ai(`「${b.name}」をかんたんに言うと：\n\n${b.plain.map(s => '・' + s).join('\n')}${b.on ? '\n\n✅ あなたはすでに適用中です。' : '\n\n⚪ まだ適用されていません。'}${b.unverified ? '\n\n※ この特典の条件はプロトタイプ用の目安です。' : ''}`);
  chat.chips(DEFAULT_CHIPS);
}

// Points for a monthly spend with caps applied; `extra` adds benefits the user isn't on yet.
function calc(spend, extra = []) {
  return BENEFITS.filter(b => b.on || extra.includes(b.id)).reduce((a, b) => {
    const raw = spend * b.rate / 100;
    return a + (b.cap ? Math.min(raw, b.cap) : raw);
  }, 0);
}
const eff = (spend, extra) => fmt(calc(spend, extra) / spend * 100);

// Steps to turn on the bank benefit, skipping what the user already has.
function bankSteps(hasAccount) {
  return [!hasAccount && '提携銀行の口座を開設（アプリから最短即日）', 'アカウント連携（提携銀行アプリで「連携する」）', 'Payカードの引き落とし口座を提携銀行に変更', '次回の引き落としが完了すると、その月から＋2%（12か月）'].filter(Boolean);
}

// The AI hears what it can't know from account data, then ranks the actions by gain.
function rateUpPlan(chat, focus) {
  hear(chat, '① 提携銀行の口座はお持ちですか？', ['持っている', '持っていない'], acc =>
    hear(chat, '② ふだんの1か月のご利用額は？', ['2万円くらい', '5万円くらい', '10万円以上'], amt => {
      const spend = { '2万円くらい': 20000, '5万円くらい': MONTH_TOTAL, '10万円以上': 100000 }[amt];
      const now = eff(spend), withBank = eff(spend, ['bank']);
      chat.card(`<div class="data">
        <div class="h"><span>あなたの倍率（月${yen(spend)}の場合）</span></div>
        <div><span>表示上の最大</span><b>${fmt(nowMax)}%</b></div>
        <div><span>上限を考えた実質</span><b>${now}%</b></div>
        <div class="h"><span>提携銀行の特典をつけると</span><b style="color:var(--brand)">${withBank}%</b></div>
        <div><span>増えるポイント</span><b>＋${pt(calc(spend, ['bank']) - calc(spend))}／月</b></div></div>`);
      const steps = bankSteps(acc === '持っている');
      chat.ai(`いちばん効くのは「Payカード×提携銀行」です（＋2%）。\n${acc === '持っている' ? '口座はお持ちなので、あと' : 'やることは'}${steps.length}ステップです。\n\n${steps.map((s, i) => `${i + 1}. ${s}`).join('\n')}`);
      const tips = [];
      if (spend > 20000) tips.push(`ランク特典は月200ptが上限なので、月2万円を超えた分には付きません（表示の${fmt(nowMax)}%より実質が低いのはこのためです）。`);
      tips.push('ポイ活プランは、対象のお店や期間に使うと5%→10%になります。キャンペーン情報をチェックしましょう。');
      if (focus !== 'bank') chat.later(() => { chat.ai('ほかにできること：\n\n' + tips.map(t => '・' + t).join('\n')); chat.chips(['手続きを始める', ...DEFAULT_CHIPS.slice(2)]); }, 700);
      else chat.chips(['手続きを始める', ...DEFAULT_CHIPS.slice(2)]);
    }));
}

const chat = createChat({
  title: '倍率アップAI',
  greet: () => ({ text: `いまのあなたは最大${fmt(nowMax)}%還元です。\nあと +${fmt(potMax - nowMax)}% 上げられます。何をすれば上がるか、あなたに合わせてご案内します。`, chips: DEFAULT_CHIPS }),
  handle(q, chat) {
    const b = BENEFITS.find(b => q.includes(b.name));
    if (/上げ|簡単|アップ|増や/.test(q) && !/15\.5/.test(q)) {
      return withConsent(chat, ['card'], () => rateUpPlan(chat, b && b.id));
    }
    if (/15\.5|最大/.test(q)) {
      chat.ai(`15.5%にするには、次の2つが必要です。\n\n1. 「Payカード×提携銀行」を適用（＋2%）\n2. ポイ活プランを対象のお店・期間で使う（5%→10%、＋5%）\n\n⚠️ ただし特典ごとに月の上限があるので、15.5%はあくまで「表示上の最大」です。実際に何%になるかは「倍率を上げるには？」で計算できます。`);
    } else if (/頭打ち|上限/.test(q)) {
      chat.ai(`月の上限がある特典：\n${BENEFITS.filter(b => b.cap).map(b => `・${b.name}：月${b.cap.toLocaleString()}pt（月${Math.round(b.cap / b.rate * 100).toLocaleString()}円で到達）`).join('\n')}\n\n今月のご利用（${yen(MONTH_TOTAL)}）では「ランク特典」が上限に届いています。これ以上使っても、ランク特典のポイントは増えません。`);
    } else if (/手続き|始める/.test(q)) {
      chat.ai('手続きは提携銀行のアプリから進めます（プロトタイプのため画面遷移はしません）。\n途中で分からないことがあれば、いつでもここで聞いてください。');
    } else if (b) return explain(b, chat);
    else chat.ai('すみません、うまく理解できませんでした。「倍率を上げるには？」や特典の名前で聞いてみてください。');
    chat.chips(DEFAULT_CHIPS);
  },
});
document.getElementById('upAi').onclick = () => { chat.open(); chat.ask('倍率を上げるには？'); };
</script>
</body>
</html>
