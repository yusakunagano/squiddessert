<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemma 4 × Gemini Flash 比較</title>
<style>
  :root { --bg: #f6f6f8; --card: #fff; --text: #1d1d1f; --sub: #6e6e73; --line: #e5e5ea; --accent: #3b5bdb; --ok: #2b8a3e; --err: #c92a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --card: #1c1c1f; --text: #f2f2f4; --sub: #9a9aa0; --line: #2c2c30; --accent: #8ea2ff; --ok: #69db7c; --err: #ff8787; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.7; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .lead { color: var(--sub); margin: 0 0 20px; font-size: 14px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  label, summary { font-weight: 600; font-size: 14px; }
  summary { cursor: pointer; }
  textarea { width: 100%; margin-top: 8px; padding: 10px 12px; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; resize: vertical; }
  #context { min-height: 120px; }
  #question { min-height: 90px; }
  .hint { font-size: 12px; color: var(--sub); margin: 6px 0 0; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 9px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .row .grow { flex: 1; }
  .opt { font-weight: normal; font-size: 13px; color: var(--sub); }
  .answers { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 600px) { .answers { grid-template-columns: 1fr; } }
  .answer { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .answer h3 { margin: 0 0 6px; font-size: 15px; }
  .answer p { margin: 0; white-space: pre-wrap; font-size: 14px; }
  .answer .meta { margin-top: 8px; font-size: 12px; color: var(--sub); }
  .answer .speed { margin-top: 10px; font-size: 13px; font-weight: 600; }
  .answer .speed.fast { color: var(--ok); }
  .answer .error { color: var(--err); }
  .votes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .votes button { flex: 1; min-width: 120px; }
  .tally { font-size: 14px; }
  .tally table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .tally td, .tally th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); font-weight: normal; }
  .tally th { color: var(--sub); font-size: 12px; }
  .status { margin: 8px 0; color: var(--sub); font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Gemma 4 × Gemini Flash 比較</h1>
  <p class="lead">同じコンテキストと質問を 2 つのモデルに投げて、答えと返答速度を並べて比べます。続けて質問すると、それぞれのモデルが自分の前の答えを踏まえて会話を続けます。</p>

  <div class="panel">
    <label for="context">コンテキスト（任意）</label>
    <textarea id="context" placeholder="質問の前提になる情報。例：資料の文章、口調や役割の指定、過去のやりとり など"></textarea>
    <p class="hint">この内容はこのブラウザにだけ保存され、会話の最初の発言に付けて AI へ送られます。無料枠だと送信内容が Google のサービス改善に使われる場合があるので、公開してよい内容で試してください。</p>
  </div>

  <div class="panel">
    <label for="question">質問プロンプト</label>
    <textarea id="question" maxlength="3000" placeholder="例：このコンテキストを 3 行で要約して"></textarea>
    <div class="row">
      <label class="opt"><input type="checkbox" id="blind" checked> モデル名を伏せて比べる</label>
      <span class="hint grow" id="turns" style="margin:0"></span>
      <button id="newChat" hidden>新しい会話にする</button>
      <button class="primary" id="ask">聞く</button>
    </div>
    <p class="hint">Ctrl（Mac は ⌘）+ Enter でも送れます。</p>
  </div>

  <div id="status" class="status" hidden></div>

  <div id="result" hidden>
    <div class="answers" id="answers"></div>
    <div class="votes" id="votes">
      <button data-vote="A">Aが良い</button>
      <button data-vote="B">Bが良い</button>
      <button data-vote="tie">どちらも同じくらい</button>
      <button data-vote="none">どちらもだめ</button>
    </div>
  </div>

  <div class="panel tally" id="tallyBox" style="margin-top:16px">
    <strong>これまでの結果</strong>
    <table id="tally"></table>
    <div class="row"><button id="resetTally">結果をリセット</button></div>
  </div>
</main>

<script>
(() => {
  // GitHub Pages に置くときは API の置き場所（Vercel）を指す。他のアプリと同じ設定。
  const API_ORIGIN = "https://squiddessert.vercel.app";
  const API_URL = API_ORIGIN + "/api/model-compare";
  const LS_CONTEXT = "model-compare.context";
  const LS_TALLY = "model-compare.tally";
  const LS_SPEED = "model-compare.speed";

  const $ = (id) => document.getElementById(id);
  const contextEl = $("context"), questionEl = $("question"), askBtn = $("ask"), blindEl = $("blind");
  const MAX_TURNS = 10; // API 側の上限と同じ
  const NAMES = { gemini: "Gemini Flash", gemma: "Gemma 4" };
  let current = null; // { order: [result, result], voted: boolean }
  // モデルごとの会話の履歴。それぞれ、そのモデル自身の答えが入る。
  let histories = { gemini: [], gemma: [] };
  let turns = 0;

  const store = {
    get(key) { try { return localStorage.getItem(key); } catch { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch {} },
  };
  const loadJson = (key, fallback) => {
    try { return { ...fallback, ...JSON.parse(store.get(key) || "{}") }; } catch { return fallback; }
  };

  contextEl.value = store.get(LS_CONTEXT) ?? "";
  contextEl.addEventListener("input", () => store.set(LS_CONTEXT, contextEl.value));

  const sec = (ms) => (ms / 1000).toFixed(1) + " 秒";

  // 集計：勝ち数と、返答速度（両方成功した回の合計ミリ秒と回数）
  const emptyTally = () => ({ gemini: 0, gemma: 0, tie: 0, none: 0, total: 0 });
  const emptySpeed = () => ({ gemini: { sum: 0, n: 0 }, gemma: { sum: 0, n: 0 } });
  const renderTally = () => {
    const t = loadJson(LS_TALLY, emptyTally());
    const sp = loadJson(LS_SPEED, emptySpeed());
    const pct = (n) => (t.total ? Math.round((n / t.total) * 100) + "%" : "-");
    const avg = (id) => (sp[id]?.n ? sec(sp[id].sum / sp[id].n) : "-");
    $("tally").innerHTML = "";
    const add = (cells, head) => {
      const tr = document.createElement("tr");
      for (const c of cells) {
        const cell = document.createElement(head ? "th" : "td");
        cell.textContent = c;
        tr.append(cell);
      }
      $("tally").append(tr);
    };
    add(["", "良い", "割合", "平均の返答速度"], true);
    add([NAMES.gemini, t.gemini, pct(t.gemini), avg("gemini")]);
    add([NAMES.gemma, t.gemma, pct(t.gemma), avg("gemma")]);
    add(["同じくらい", t.tie, pct(t.tie), ""]);
    add(["どちらもだめ", t.none, pct(t.none), ""]);
    add(["投票の合計", t.total, "", `${sp.gemini?.n ?? 0} 回分`]);
  };
  $("resetTally").addEventListener("click", () => {
    if (confirm("集計をリセットしますか？")) { store.set(LS_TALLY, "{}"); store.set(LS_SPEED, "{}"); renderTally(); }
  });

  const setStatus = (text) => { $("status").hidden = !text; $("status").textContent = text || ""; };

  const renderTurns = () => {
    $("turns").textContent = turns ? `この会話：${turns} 回目まで` : "";
    $("newChat").hidden = !turns;
  };
  $("newChat").addEventListener("click", () => {
    histories = { gemini: [], gemma: [] };
    turns = 0;
    $("result").hidden = true;
    setStatus("");
    renderTurns();
  });

  const renderAnswers = (revealed) => {
    const box = $("answers");
    box.innerHTML = "";
    const okTimes = current.order.filter((r) => !r.error).map((r) => r.ms);
    const fastest = okTimes.length === 2 ? Math.min(...okTimes) : null;
    current.order.forEach((r, i) => {
      const card = document.createElement("div");
      card.className = "answer";
      const h = document.createElement("h3");
      h.textContent = revealed ? `${"AB"[i]}：${r.label}` : "AB"[i];
      const p = document.createElement("p");
      if (r.error) { p.textContent = r.error; p.className = "error"; } else { p.textContent = r.reply; }
      card.append(h, p);
      if (r.error && r.detail) {
        const d = document.createElement("div");
        d.className = "meta";
        d.textContent = `${r.label}（${r.model}）：${r.detail}`;
        card.append(d);
      }
      if (revealed) {
        const speed = document.createElement("div");
        const isFast = fastest !== null && r.ms === fastest;
        speed.className = "speed" + (isFast ? " fast" : "");
        speed.textContent = `返答速度 ${sec(r.ms)}${isFast ? "（速い）" : ""}`;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = r.model;
        card.append(speed, meta);
      }
      box.append(card);
    });
  };

  // モデル名が違うとき、使える名前を出す（Vercel の環境変数 GEMMA_MODEL / FLASH_MODEL に設定する）
  async function showModels() {
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "models" }),
      });
      const data = await res.json();
      if (res.ok) setStatus(`${$("status").textContent}　使えるモデル名：${data.models.join(", ")}（Vercel の環境変数 GEMMA_MODEL か FLASH_MODEL に設定できます）`);
    } catch {}
  }

  async function ask() {
    const question = questionEl.value.trim();
    if (!question) return;
    if (turns >= MAX_TURNS) { setStatus(`会話は ${MAX_TURNS} 回までです。「新しい会話にする」を押してください。`); return; }
    askBtn.disabled = true;
    $("result").hidden = true;
    setStatus("2つのモデルに聞いています…（数十秒かかることがあります）");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ context: contextEl.value, question, history: histories }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "エラーが発生しました");
      // どちらが A か分からないように毎回シャッフルする
      const order = data.results.slice();
      if (Math.random() < 0.5) order.reverse();
      const bothOk = order.every((r) => !r.error);
      const blind = blindEl.checked;
      current = { order, voted: !bothOk }; // 片方が失敗したときは比べられないので投票しない
      if (bothOk) {
        // 両方成功した回だけ会話に加え、返答速度を集計する（片方だけ進むと、同じ条件で比べられなくなる）
        for (const r of order) histories[r.id].push({ role: "user", text: question }, { role: "assistant", text: r.reply });
        const sp = loadJson(LS_SPEED, emptySpeed());
        for (const r of order) { sp[r.id] = sp[r.id] ?? { sum: 0, n: 0 }; sp[r.id].sum += r.ms; sp[r.id].n += 1; }
        store.set(LS_SPEED, JSON.stringify(sp));
        turns += 1;
        questionEl.value = "";
        setStatus(turns >= MAX_TURNS ? `会話は ${MAX_TURNS} 回までです。続ける場合は「新しい会話にする」を押してください。` : "");
        renderTurns();
        if (!blind) renderTally(); // 伏せているときは、速度で見分けがつかないよう投票のあとに更新する
      }
      renderAnswers(!bothOk || !blind);
      $("votes").hidden = !bothOk;
      $("result").hidden = false;
      if (!bothOk) {
        setStatus("片方の呼び出しに失敗したので、この回は集計せず、会話にも加えません。");
        showModels();
      }
    } catch (e) {
      setStatus(e.message);
    } finally {
      askBtn.disabled = false;
    }
  }

  askBtn.addEventListener("click", ask);
  questionEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !e.isComposing) ask(); });

  $("votes").addEventListener("click", (e) => {
    const vote = e.target.dataset?.vote;
    if (!vote || !current || current.voted) return;
    current.voted = true;
    const t = loadJson(LS_TALLY, emptyTally());
    t.total += 1;
    if (vote === "A" || vote === "B") t[current.order["AB".indexOf(vote)].id] += 1;
    else t[vote] += 1;
    store.set(LS_TALLY, JSON.stringify(t));
    renderAnswers(true);
    $("votes").hidden = true;
    renderTally();
  });

  renderTally();
})();
</script>
</body>
</html>
