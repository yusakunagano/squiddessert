<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>特集一覧（プロトタイプ）</title>
<link rel="stylesheet" href="app.css?v=20261115">
<style>
  body { background: var(--bg); }
  main { padding: 16px 16px 120px; }
  .lead { font-size: 13px; color: var(--sub); margin: 0 0 12px; line-height: 1.7; }
  .banner { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: #fff8e1; color: #8a5a00; font-size: 12px; line-height: 1.7; }
  .banner.real { background: #e8f6ee; color: #1a6b3a; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .filters button { padding: 6px 14px; border: 1px solid var(--line); border-radius: 16px; background: #fff; font-size: 13px; cursor: pointer; }
  .filters button.sel { border-color: var(--brand); background: var(--brand-weak); color: var(--brand); font-weight: 700; }
  .opts { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 13px; }
  .opts input[type=checkbox] { width: 20px; height: 20px; }
  .q { width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff; margin-bottom: 10px; }
  .count { font-size: 12px; color: var(--sub); margin: 0 0 8px; }
  .item { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .item h2 { font-size: 15px; margin: 6px 0 4px; line-height: 1.5; overflow-wrap: anywhere; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; background: var(--bg); color: var(--sub); }
  .tag.pay { background: #fde7ec; color: var(--brand); } .tag.pt { background: #e8f1ff; color: #1a5fd0; }
  .tag.need { background: #fff1d6; color: #a15c00; } .tag.free { background: #e8f6ee; color: var(--ok); }
  .period { font-size: 12px; color: var(--sub); margin: 2px 0 6px; }
  .desc { font-size: 13px; line-height: 1.7; margin: 4px 0; }
  details.cond { margin: 6px 0; font-size: 13px; }
  details.cond summary { cursor: pointer; color: var(--brand); font-weight: 700; }
  details.cond dl { margin: 6px 0 0; display: grid; grid-template-columns: 6.5em 1fr; gap: 4px 8px; }
  details.cond dt { color: var(--sub); } details.cond dd { margin: 0; overflow-wrap: anywhere; }
  .go { display: block; margin-top: 8px; padding: 10px; border: 1px solid var(--brand); border-radius: 20px; color: var(--brand); font-size: 13px; font-weight: 700; text-align: center; text-decoration: none; }
  .empty { padding: 28px 12px; text-align: center; color: var(--sub); font-size: 13px; background: #fff; border-radius: 14px; }
  .foot { margin-top: 16px; font-size: 12px; color: var(--sub); text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<script src="gate.js?v=20261029"></script>
<div class="app slide-in">
  <header><a href="index.html" aria-label="戻る">‹</a><h1>特集一覧</h1><span style="width:20px"></span></header>
  <main>
    <p class="lead">開催中・予定のキャンペーン（特集）の一覧です。気になるものを、種別やエントリーの有無で絞り込めます。</p>
    <div class="banner" id="banner" hidden></div>
    <div class="filters" id="kinds" role="group" aria-label="種別"></div>
    <label class="opts"><input type="checkbox" id="needOnly"> エントリーが必要なものだけ</label>
    <input class="q" id="q" type="search" placeholder="キーワードで探す（例：ネット）" autocomplete="off">
    <p class="count" id="count" aria-live="polite"></p>
    <div id="list"></div>
    <p class="foot">条件・対象店舗・期間は変わることがあります。<br>最新の内容は、<a id="top" target="_blank" rel="noopener noreferrer">キャンペーンの公式ページ</a>で確認してください。</p>
  </main>
</div>
<script src="campaigns.js?v=20261106"></script>
</body>
</html>
