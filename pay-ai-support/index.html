<style>
  .top { background: linear-gradient(135deg, #ff4d6d, var(--brand)); color: #fff; padding: 16px 16px 56px; }

  .cards { display: flex; gap: 12px; margin-top: -44px; padding: 0 16px 6px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; cursor: grab; touch-action: pan-x pan-y; }
  .cards::-webkit-scrollbar { display: none; }
  .cards.drag { cursor: grabbing; scroll-snap-type: none; user-select: none; }
  .slide { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; }
  .dots { display: flex; justify-content: center; gap: 8px; margin: 8px 0 -4px; }
  .dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: #c9c9ce; cursor: pointer; transition: width .2s, background .2s; }
  .dots button.on { width: 20px; border-radius: 4px; background: var(--brand); }
  .dcard { aspect-ratio: 1.586; border-radius: 14px; padding: 16px 18px; color: #fff; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 14px rgba(0,0,0,.14); background: linear-gradient(135deg, #f0284f 0%, #e60033 45%, #b3002a 100%); }
  /* AIで「ゴールド」にしたときの券面 */
  .dcard.gold { background: linear-gradient(135deg, #f6e08e 0%, #d9a93b 45%, #a97a16 100%); color: #3d2a05; }

  .dcard.gold .kind { font-weight: 700; letter-spacing: .08em; }
  .dcard::before { content: ''; position: absolute; width: 260px; height: 260px; border-radius: 50%; right: -90px; top: -110px; background: rgba(255,255,255,.12); }
  .dcard::after { content: ''; position: absolute; width: 220px; height: 220px; border-radius: 50%; left: -80px; bottom: -130px; background: rgba(255,255,255,.08); }
  .dcard > * { position: relative; z-index: 1; }
  .dcard .row { display: flex; justify-content: space-between; align-items: flex-start; }
  .dcard .brandname { font-size: 24px; font-weight: 800; letter-spacing: .02em; line-height: 1.1; }
  .dcard .kind { font-size: 11px; opacity: .9; margin-top: 2px; }
  .dcard .chip { width: 40px; height: 30px; border-radius: 6px; background: linear-gradient(135deg, #f7e3a3, #d8b45a); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); position: relative; }
  .dcard .chip::before { content: ''; position: absolute; inset: 6px 0; border-top: 1px solid rgba(0,0,0,.18); border-bottom: 1px solid rgba(0,0,0,.18); }
  .dcard .chip::after { content: ''; position: absolute; inset: 0 13px; border-left: 1px solid rgba(0,0,0,.18); border-right: 1px solid rgba(0,0,0,.18); }
  .dcard .num { font-size: 17px; letter-spacing: .14em; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .dcard .bottom { display: flex; justify-content: space-between; align-items: flex-end; font-size: 12px; }
  .dcard .bottom small { display: block; font-size: 9px; opacity: .85; }
  .wallet { background: #fff; color: var(--text); border-radius: 14px; padding: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .wallet small { color: var(--sub); font-size: 12px; }
  .wallet .amt { font-size: 28px; font-weight: 800; margin: 2px 0 8px; }
  .wallet .pt { font-size: 13px; color: var(--sub); }
  .wallet.slide { display: flex; flex-direction: column; } /* カードの高さに合わせて伸びても、ボタンは下に寄せる */
  .pay { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; }
  .pay button { flex: 1; padding: 12px; border-radius: 22px; border: 0; background: var(--brand); color: #fff; font-weight: 700; font-size: 15px; }
  .pay button.sub { background: var(--brand-weak); color: var(--brand); }
  .menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: #fff; margin: 14px 16px 0; padding: 14px 8px; border-radius: 14px; }
  .menu a { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--text); text-decoration: none; text-align: center; }
  .menu a span { width: 44px; height: 44px; border-radius: 12px; background: var(--brand-weak); display: grid; place-items: center; font-size: 20px; }
  .menu a.new span { position: relative; }
  .menu a.new span::after { content: 'AI'; position: absolute; top: -6px; right: -8px; background: #ffb300; color: #fff; font-size: 9px; font-weight: 800; padding: 1px 4px; border-radius: 6px; }
  .banner { margin: 14px 16px 0; padding: 14px; border-radius: 14px; background: #fff; display: flex; gap: 12px; align-items: center; font-size: 13px; }
  .banner b { display: block; font-size: 14px; }
  .revoke { display: block; margin: 18px auto 0; background: none; border: 0; color: var(--sub); font-size: 12px; text-decoration: underline; cursor: pointer; }

<script>
document.getElementById('bal').textContent = yen(USER.balance);
document.getElementById('pt').textContent = `ポイント ${USER.points.total.toLocaleString()}pt`;
// 券面：スクロール位置に合わせて点を切り替え、点のクリックや、マウスのドラッグでも切り替えられる
(() => {
  const box = document.getElementById('cards'), dots = [...document.querySelectorAll('#dots button')];
  const step = () => box.querySelector('.slide').offsetWidth + 12; // 1 枚ぶんの幅（すきま込み）
  const show = (i, smooth = true) => box.scrollTo({ left: i * step(), behavior: smooth ? 'smooth' : 'auto' });
  const current = () => Math.max(0, Math.min(dots.length - 1, Math.round(box.scrollLeft / step())));
  box.addEventListener('scroll', () => dots.forEach((d, i) => d.classList.toggle('on', i === current())), { passive: true });
  dots.forEach((d, i) => { d.onclick = () => show(i); });
  // カードの券面（左端）に来たら、AIにも知らせる（AIのメニューが、カードの問い合わせに切り替わる）
  let wasCard = false;
  box.addEventListener('scroll', () => { const c = current() === 0; if (c !== wasCard) { wasCard = c; document.dispatchEvent(new CustomEvent('cardarea', { detail: c })); } }, { passive: true });
  show(1, false); // 最初は Pay の残高を表示（カードは左側）
  box.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') show(current() - 1); if (e.key === 'ArrowRight') show(current() + 1); });
  let startX = 0, startLeft = 0, startIndex = 0, moved = false, dragging = false;
  box.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') return; dragging = true; moved = false; startX = e.clientX; startLeft = box.scrollLeft; startIndex = current(); });
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    if (!moved && Math.abs(e.clientX - startX) > 5) { moved = true; box.classList.add('drag'); }
    if (moved) box.scrollLeft = startLeft - (e.clientX - startX);
  });
  window.addEventListener('pointerup', (e) => {
    if (!dragging) return; dragging = false;
    if (!moved) return;
    box.classList.remove('drag');
    const dx = e.clientX - startX; // 40px 以上動かしたら、動かした向きの隣へ
    show(Math.max(0, Math.min(dots.length - 1, startIndex + (dx < -40 ? 1 : dx > 40 ? -1 : 0))));
  });
  box.addEventListener('click', (e) => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true); // ドラッグのあとは、ボタンを押したことにしない
})();
document.getElementById('revoke').onclick = () => { Link.revoke(); alert('AIとのアカウント連携を解除しました'); };

const BASE_CHIPS = ['🧠 AIエージェントを使う', '🎁 お得な情報を知りたい', '送金したい', '履歴を見たい', 'ポイントの期限は？', 'カードをなくした'];
// カードの券面にスワイプしたときの、問い合わせ項目（コールリーズンをもとにした一覧）
const CARD_REASONS = [
  { q: '手元にあるカードを解約したい', a: 'カードの解約は、アプリの「カード」→「カードの解約」から手続きできます。\n解約すると、ポイントの引き継ぎや、カードに紐づくお支払い設定（公共料金など）が使えなくなります。先にご確認ください。\n手元のカードは、解約の手続きのあと、ハサミで切って処分してください（ICチップと磁気帯に切り込みを入れます）。' },
  { q: 'カードを利用できない原因を確認したい', a: '次のような原因が考えられます。\n・利用限度額に達している\n・お支払いの遅れや、引き落とし口座の残高不足\n・暗証番号を連続して間違えて、ロックされている\n・不正利用の疑いで、一時的に止められている\n・カードの有効期限が切れている\n心当たりのあるものを選んでください。分からないときは、アプリの「カード」→「ご利用状況」で、止まっている理由を確認できます。' },
  { q: '身に覚えのないカード請求への対応を確認したい', a: '身に覚えのない請求を見つけたときは、次の順で対応してください。\n① すぐに、アプリの「カード」→「カードの一時停止」で、カードを止めます。\n② 利用明細で、日付・店舗・金額を確認します。家族の利用や、定期払いの引き落としではないかも、確認してください。\n③ 心当たりがなければ、カード会社に連絡して、調査を依頼します。\n不正利用だと確認できた場合は、補償の対象になることがあります（届け出の期限があります）。' },
  { q: '郵送で上位カードから下位カードへの切替手続きをしたい', a: '上位のカード（例：ゴールド）から、下位のカード（例：一般）への切り替えは、郵送の書類でも手続きできます。\n① 「カード」→「カードの切り替え」で、切り替えの申込書を請求します（数日で届きます）。\n② 申込書に記入して、返信用封筒で返送します。\n③ 手続き完了後、新しいカードが届きます。\n切り替えると、特典の内容や年会費が変わります。ポイントは引き継がれます。' },
  { q: '預かり中のカードの発送を依頼したい', a: '不在などで、カード会社が預かっているカードは、発送を依頼できます。\n「カード」→「預かり中のカード」から、受け取りたい日時と、送り先の住所を選んでください。\n送り先は、ご本人の住所のみです。依頼から数日でお届けします（本人限定の受け取りです）。' },
  { q: 'Apple Payでカードを利用するため電話認証を完了したい', a: 'Apple Payにカードを登録したあと、ご本人確認として、電話での認証が必要です。\n① Apple Payのカードの画面に出ている、認証の電話番号に発信してください。\n② 音声ガイダンスに沿って、カードの暗証番号や、生年月日を入力します。\n③ 認証が完了すると、Apple Payで使えるようになります。\nなお、認証の電話は、ご登録の電話番号からおかけください。' },
  { q: '用件不明のため問い合わせ内容を確認したい', a: '問い合わせの内容が、はっきりしないときは、次のうち近いものを選んでください。\n・カードが使えない\n・請求の内容が分からない\n・手続き（解約・住所変更など）をしたい\n・紛失・盗難にあった\n・ポイントについて知りたい\n入力で、困っていることを書いていただいても大丈夫です。' },
  { q: '更新カードの発送', a: '有効期限が近いカードは、期限の前に、新しい更新カードが自動で届きます（期限の1〜2か月前に発送）。\n届いていないときは、「カード」→「更新カードの発送状況」で、発送の状況を確認できます。住所に不備があると、届かずに戻ってしまうため、ご住所もご確認ください。\n新しいカードが届いたら、古いカードは、ハサミで切って処分してください。' },
  { q: 'カードの申込', a: 'カードの新規のお申し込みは、アプリの「カード」→「カードを申し込む」から、最短5分ほどで手続きできます。\n必要なもの：本人確認書類（マイナンバーカードや運転免許証）、引き落とし口座（銀行口座）。\n審査のあと、カードは、約1週間で届きます。一部のお店では、届く前でもアプリで使えます。' },
  { q: 'ポイ活 MAXが現在の料金プランより得か比較したい', a: '「ポイ活 MAX」が、いまのプランより得かどうかは、毎月のご利用額で変わります。\n目安：毎月のカードのご利用額が多いほど、ポイントで得になりやすいです。\n正確な比較は、「利用サービス」の画面で、いまの倍率と、ポイ活 MAXにしたときの倍率を並べて確認できます。開いて、比べてみましょう。' },
  { q: '住所不備', a: 'ご登録の住所に不備があると、カードや書類が届かず、戻ってきてしまうことがあります。\n「カード」→「登録情報の変更」→「住所」から、都道府県・番地・建物名・部屋番号まで、正しく入力し直してください。\n変更後、戻ってきているカードや書類は、あらためて発送されます（発送の依頼が必要な場合があります）。' },
  { q: 'カードの暗証番号ロックを解除したい', a: '暗証番号を連続して間違えると、カードがロックされます。\n解除の方法：「カード」→「暗証番号のロックの解除」で、本人確認（認証）をしてください。解除後に、新しい暗証番号を設定できます。\nお急ぎのときや、アプリで解除できないときは、カード会社のサポートへお問い合わせください。' },
  { q: '不正利用のおそれがあるカードを停止したい', a: '不正利用のおそれがあるときは、すぐにカードを止めてください。\n「カード」→「カードの一時停止」で、今すぐ止められます（24時間いつでも）。止めても、再開は、いつでもできます。\n紛失・盗難や、不正利用が確認できたときは、カードの再発行も手続きしてください。身に覚えのない請求がある場合は、調査も依頼してください。' },
];
// ステータス（カードの種類）：一般 ⇄ ゴールド。AIが利用状況を見て、ゴールドの券面にする（デモ）
const GOLD_NEED = 50000; // 直近2か月のカード利用額の目安（デモ用）
const cardRank = () => { try { return sessionStorage.getItem('payCardRank') === 'gold' ? 'gold' : 'normal'; } catch (e) { return 'normal'; } };
function applyCardRank() {
  const gold = cardRank() === 'gold', c = document.querySelector('.dcard'), k = document.getElementById('ckind');
  if (c) c.classList.toggle('gold', gold);
  if (k) k.textContent = gold ? 'ゴールド' : 'クレジットカード';
}
function setCardRank(r) { try { sessionStorage.setItem('payCardRank', r); } catch (e) {} applyCardRank(); }
applyCardRank();
const DEFAULT_CHIPS = [...BASE_CHIPS];
// カードの券面を表示している間は、AIのメニューをカードの問い合わせにする（配列の中身を入れ替える）
document.addEventListener('cardarea', (e) => {
  DEFAULT_CHIPS.splice(0, DEFAULT_CHIPS.length, ...(e.detail ? [...CARD_REASONS.map(r => r.q), 'カードの請求額', '✨ カードをゴールドにしたい'] : BASE_CHIPS));
  chat.resetGreeting(); // まだ会話していなければ、次に開いたときに、メニューを作り直す
});

// General questions: answered from public product info, no account data needed.
const FAQ = [
  { k: ['使えるお店', '使える店', '加盟店'], a: 'コンビニ、スーパー、飲食店、ネット通販など全国のお店で使えます。お店の入口やレジのロゴが目印です。' },
  { k: ['支払い方', '払い方', 'お店', 'レジ', 'コード'], a: 'お店では、ホームの「支払う」を押してバーコードを見せるか、お店のQRコードを読み取って支払います。\n支払い元は「残高」「カード」から選べます。' },
  { k: ['チャージ'], a: 'ホームの「チャージ」から、登録した銀行口座・ATM・カードでチャージできます。\n銀行口座がまだの方は、メニューの「銀行口座登録」から登録できます。' },
  { k: ['なくし', '紛失', '盗', '落とし'], a: 'カードを紛失した場合は、すぐにカードの利用停止をしてください。\nアプリの「カード」→「カードの一時停止」から24時間いつでも止められます。不正利用の補償もあるので、あわせてカスタマーセンターへご連絡ください。' },
  { k: ['年会費'], a: 'カードの年会費はカードの種類（プラン）によって異なります。詳しくはカードの商品ページをご覧ください。' },
  { k: ['ポイント', '貯め', 'たまる', '還元'], a: 'ポイントは、アプリ払い・カード払いのどちらでも貯まります。銀行のランク優遇やポイント連携の条件は「利用サービス」ページのAIが詳しくご案内します。' },
];

// Personal questions: need account linking + consent, then the AI asks what exactly the user wants.
// Requests to *do* something open that feature directly instead of answering in chat.
// Context for the お得情報 AI. Based on the official Oct–Nov 2026 campaign announcements
// (the campaign page itself couldn't be fetched, so details are summarized).
const CAMPAIGNS = [
  '【エリアキャンペーン（抽選）】2026年10月開始・全国8地域の対象店舗でアプリ払い。エントリー不要。1等100%・2等50%・3等10%・4等1%を抽選で還元。上限は1回30,000pt・期間中30,000pt。期間は地域ごと（例：長野市 10/23〜11/23）。予算に達すると期間内でも終了。',
  '【ネットショッピング（抽選）】対象ネットショップでアプリ払いすると抽選で最大20%還元。1回の決済の上限2,000pt。エントリーが必要な場合あり。一部ショップ（ふるさと納税サイトの一部など）は2026年10月から対象外。',
  '【自治体キャンペーン】自治体ごとの対象店舗で最大30%還元など。上限は自治体ごと（例：1回10,000pt・期間40,000pt）。10月と11月で上限が別枠の地域もある。11月開始の地域も追加。',
  '【利用サービスの倍率】適用中の特典の合計で最大8.5%、未適用の「Payカード×提携銀行（＋2%）」とポイ活プラン10%を含めると最大15.5%。詳しくは利用サービス画面。',
  '※ キャンペーンは地域・期間・予算で変わる。最新の対象店舗・条件は公式のキャンペーンページで確認するよう案内する。',
];

const ACTIONS = [
  { re: /送金|送り(たい|ます)|送って|送る|割り勘/, name: '送金', url: q => {
      const amt = (q.match(/([0-9０-９,]+)\s*円/) || [])[1];
      const to = (q.match(/(\S+?(?:さん|くん|ちゃん)?)に/) || [])[1];
      const params = new URLSearchParams();
      if (amt) params.set('amount', amt.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/,/g, ''));
      if (to && !/送金|お金/.test(to)) params.set('to', to);
      return 'send.html' + (params.toString() ? '?' + params : '');
    } },
  { re: /履歴|明細/, name: '利用履歴', url: () => 'services.html#hist' },
  { re: /チャージ(したい|する|して)/, name: 'チャージ', url: () => null },
];

const PERSONAL = [
  { k: ['使った', '利用額', '使いすぎ', 'いくら使'], scopes: ['history'], run: chat =>
      hear(chat, 'どの支払いのご利用額を知りたいですか？', ['アプリ払い', 'カード', '両方'], how =>
        hear(chat, '期間はいつですか？', ['今月', '先月'], when => {
          const key = when === '今月' ? 'thisMonth' : 'lastMonth';
          const app = USER.usage.app[key], card = USER.usage.card[key];
          const rows = how === 'アプリ払い' ? [['アプリ払い', app]] : how === 'カード' ? [['カード', card]] : [['アプリ払い', app], ['カード', card], ['合計', app + card]];
          chat.card(`<div class="data"><div class="h"><span>${when}のご利用額</span></div>${rows.map(([n, v]) => `<div><span>${n}</span><b>${yen(v)}</b></div>`).join('')}</div>`);
          const prev = USER.usage.app.lastMonth + USER.usage.card.lastMonth, now = USER.usage.app.thisMonth + USER.usage.card.thisMonth;
          chat.ai(when === '今月' ? `今月は先月の同じ時期より ${yen(prev - now)} 少ないペースです。` : '今月のご利用は「今月」でご確認いただけます。');
          chat.chips(DEFAULT_CHIPS);
        })) },
  { k: ['請求', '引き落と', '支払日', '引落'], scopes: ['card'], run: chat =>
      hear(chat, '次回のカード請求について、何を知りたいですか？', ['金額', '引き落とし日', 'ぜんぶ'], what => {
        const b = USER.bill;
        if (what === '金額') chat.ai(`次回のご請求額は ${yen(b.amount)} です。`);
        else if (what === '引き落とし日') chat.ai(`次回の引き落とし日は ${b.date} です。前日までに ${b.bank} の口座へのご入金をお願いします。`);
        else chat.card(`<div class="data"><div class="h"><span>次回のカードご請求</span></div><div><span>ご請求額</span><b>${yen(b.amount)}</b></div><div><span>引き落とし日</span><b>${b.date}</b></div><div><span>引き落とし口座</span><b>${b.bank}</b></div></div>`);
        chat.chips(DEFAULT_CHIPS);
      }) },
  { k: ['残高', 'ポイントの期限', '期限', '何ポイント', 'ポイント数'], scopes: ['balance'], run: chat =>
      hear(chat, '何を確認しますか？', ['残高', 'ポイント合計', '期限が近いポイント'], what => {
        const p = USER.points;
        if (what === '残高') chat.ai(`アプリの残高は ${yen(USER.balance)} です。`);
        else if (what === 'ポイント合計') chat.ai(`保有ポイントは ${p.total.toLocaleString()}pt です（うち期間・用途限定 ${p.limited}pt）。`);
        else chat.ai(`期間・用途限定ポイント ${p.limited}pt の期限が ${p.limitedExpire} です。\nお買い物の支払いに「ポイントを使う」をオンにすると、期限の近いポイントから使われます。`);
        chat.chips(DEFAULT_CHIPS);
      }) },
];

// ステータスに合わせて、カードをゴールドにする（デモ）
function goldFlow(chat) {
  const total = USER.usage.card.thisMonth + USER.usage.card.lastMonth;
  if (cardRank() === 'gold') { chat.ai('カードは、すでにゴールドです。一般に戻すこともできます。'); return chat.chips(['カードを一般に戻す', ...DEFAULT_CHIPS]); }
  chat.card(`<div class="data"><div class="h"><span>ステータスの確認</span></div><div><span>カードのご利用（今月）</span><b>${yen(USER.usage.card.thisMonth)}</b></div><div><span>カードのご利用（先月）</span><b>${yen(USER.usage.card.lastMonth)}</b></div><div><span>2か月の合計</span><b>${yen(total)}</b></div><div><span>ゴールドの目安</span><b>${yen(GOLD_NEED)}以上</b></div></div>`);
  if (total >= GOLD_NEED) {
    setCardRank('gold');
    chat.ai('直近2か月のカードのご利用額が、ゴールドの目安を超えています。\nステータスに合わせて、カードをゴールドにしました。ホームのカードの券面が、ゴールドになっています。');
    chat.chips(['カードを一般に戻す', ...DEFAULT_CHIPS]);
  } else {
    chat.ai(`直近2か月のカードのご利用額が、ゴールドの目安（${yen(GOLD_NEED)}）にあと ${yen(GOLD_NEED - total)} 届きません。ご利用が増えたら、もう一度お試しください。`);
    chat.chips(DEFAULT_CHIPS);
  }
}

// はっきりした依頼は、AIを使わずに直接動かす（お得な情報のAIモード／画面を開く）
function quick(q, chat) {
  if (/AIエージェント|プロファイ/.test(q)) { runAgentDemo(chat, { home: DEFAULT_CHIPS }); return true; }
  if (/お得|キャンペーン|特集/.test(q)) { chat.aiMode = true; chat.askAI(q); return true; }
  const act = ACTIONS.find(a => a.re.test(q));
  if (!act) return false;
  const url = act.url(q);
  if (!url) { chat.ai(`${act.name}画面はこのプロトタイプにはまだありません。`); chat.chips(DEFAULT_CHIPS); return true; }
  chat.card(`<div class="launch">🚀 「${act.name}」を開きます…</div>`);
  setTimeout(() => location.href = url, 900);
  return true;
}

// 「他の特集」「特集の一覧」は、特集一覧の画面へ飛ばす
const JUMP_CAMPAIGNS = /(他|ほか|その他)の特集|特集(の)?(一覧|リスト)|特集をすべて|すべての特集|特集を全部/;

const chat = createChat({
  title: 'AIアシスタント',
  jumps: [{ re: JUMP_CAMPAIGNS, action: 'open_campaigns' }, { re: /お得な特典/, action: 'open_services_ai' }],
  // 質問候補のボタンは、下のルールで即答する。入力した質問・音声は、AI（free）が答える。
  // 「お得な情報」は、キャンペーンの一覧を使う専用のAIモード。
  ai: { page: 'deals', facts: () => CAMPAIGNS.join('\n'), exitChip: 'ほかのことを聞く', listChip: '他の特集を見る', rateChip: 'お得な特典を知りたい',
    // 「お店でよく使う」：お店で使える特集を、必ず3つ、リンク付きで紹介する（リンクは仮）
    shopRe: /お店|店(舗)?で|店頭/,
    shop: chat => {
      const T = 'https://service.smt.docomo.ne.jp/keitai_payment/campaign/';
      chat.ai('お店でお得に使える特集を3つご紹介します。\n\n'
        + '① エリアキャンペーン（地域ごとの抽選）\n全国8地域の対象店舗でアプリ払い。1等100%・2等50%・3等10%・4等1%を抽選で還元。エントリー不要。期間は地域ごとに異なります。\n\n'
        + '② 自治体キャンペーン\n自治体ごとの対象店舗で、最大30%還元など。上限は自治体ごと。エントリーの要否・期間は、キャンペーンごとに異なります。\n\n'
        + '③ ネットショッピング 抽選で最大20%還元\n対象のネットショップでアプリ払いすると、抽選で最大20%還元。エントリーが必要な場合があります。\n\n'
        + '※ くわしい条件は、各ページで確認してください。');
      chat.links([{ title: 'エリアキャンペーン', url: T }, { title: '自治体キャンペーン', url: T }, { title: 'ネットショッピング', url: T + 'app_netshopping/' }]);
      chat.chips(['他の特集を見る', 'お得な特典を知りたい', 'ほかのことを聞く']);
    },
    // Without the AI, list the campaigns as they are.
    offline: chat => {
      chat.ai('いま開催中のお得な情報です。\n\n' + CAMPAIGNS.slice(0, 4).map(c => '・' + c).join('\n\n'));
      chat.links([{ title: 'キャンペーン一覧を見る', url: 'https://service.smt.docomo.ne.jp/keitai_payment/campaign/' }]);
      chat.chips(['他の特集を見る', 'お得な特典を知りたい', ...DEFAULT_CHIPS]);
    },
    free: { page: 'home', facts: () => FAQ.map(f => f.a).join('\n'), quick: (q, chat) => quick(q, chat) } },
  greet: () => DEFAULT_CHIPS[0] !== BASE_CHIPS[0] ? ({ text: 'カードについてのお問い合わせですね。当てはまるものを選んでください。\n入力して聞くこともできます。', chips: DEFAULT_CHIPS }) : ({ text: 'こんにちは！アプリやカードのことなら何でも聞いてください。\n質問を入力すると、AIがお答えします。「AIエージェントを使う」を選ぶと、あなたの利用の傾向を分析して、おすすめを提案します。残高・ご利用額・請求など、お客さまご自身の情報は、許可をいただいてからお答えします。', chips: DEFAULT_CHIPS }),
  handle(q, chat) {
    // カードの問い合わせ項目（ボタン）は、決まった答えで返す
    const cr = CARD_REASONS.find(r => r.q === q);
    if (cr) {
      chat.ai(cr.a);
      if (q.startsWith('ポイ活 MAX')) chat.launchLink?.('利用サービスで比べる', 'services.html');
      chat.chips(DEFAULT_CHIPS);
      return;
    }
    if (/ゴールド/.test(q)) return withConsent(chat, ['history'], () => goldFlow(chat), { intro: 'ステータス（ご利用状況）の確認に、カードの利用明細が必要です。\nアカウントを連携し、AIに渡す情報を選んでください。' });
    if (/一般に戻/.test(q)) { setCardRank('normal'); chat.ai('カードを、一般の券面に戻しました。'); chat.chips(DEFAULT_CHIPS); return; }
    if (quick(q, chat)) return;
    // Personal first: "ポイントの期限" must not fall through to the general points FAQ.
    const p = PERSONAL.find(e => e.k.some(k => q.includes(k)));
    if (p) return withConsent(chat, p.scopes, () => p.run(chat));
    const f = FAQ.find(e => e.k.some(k => q.includes(k)));
    chat.ai(f ? f.a : 'すみません、うまく理解できませんでした。下の候補から選ぶか、「チャージ」「請求」「ポイント」などの言葉で聞いてみてください。');
    chat.chips(DEFAULT_CHIPS);
  },
});
</script>
