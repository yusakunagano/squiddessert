<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>送金（プロトタイプ）</title>
<link rel="stylesheet" href="app.css?v=20261149">
<style>
  main { padding: 16px; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  label { display: block; font-size: 15px; font-weight: 700; margin: 0 0 6px; }
  input { width: 100%; padding: 12px; font-size: 18px; border: 1px solid var(--line); border-radius: 8px; }
  .amt { font-size: 28px; font-weight: 800; text-align: right; }
  .contacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .contacts button { padding: 6px 12px; border-radius: 16px; border: 1px solid var(--line); background: #fff; font-size: 15px; cursor: pointer; }
  .note { font-size: 14px; color: var(--sub); margin-top: 6px; }
  .from-ai { font-size: 14px; background: #eef3ff; border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; }
  .primary { display: block; width: 100%; padding: 14px; font-size: 18px; font-weight: 700; border: 0; border-radius: 24px; background: var(--brand); color: #fff; cursor: pointer; text-align: center; text-decoration: none; }
  .primary:disabled { background: #ccc; }
  .done { text-align: center; padding-top: 40px; }
  .done .big { font-size: 56px; color: var(--ok); }
  .app { padding-bottom: 96px; }
</style>
<script src="../ga.js?v=20261105"></script>
</head>
<body>
<script src="gate.js?v=20261029"></script>
<div class="app slide-in">
  <div class="proto">※ UIプロトタイプです。実際には送金されません</div>
  <header><a href="index.html" aria-label="戻る">‹</a><h1>送る</h1><span style="width:20px"></span></header>
  <main id="view"></main>
</div>
<script src="icons.js?v=20261146"></script>
<script src="chat.js?v=20261149"></script>
<script>
const qs = new URLSearchParams(location.search);
const CONTACTS = ['サトウ ハナコ', 'タナカ ケン', 'お母さん'];
// Values come from the URL, so escape them before putting them in HTML.
const esc = v => String(v).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const state = { to: qs.get('to') || '', amount: qs.get('amount') || '' };

function form() {
  const fromAi = qs.has('to') || qs.has('amount');
  document.getElementById('view').innerHTML = `
    ${fromAi ? '<div class="from-ai">' + ic('ai') + ' AIアシスタントがお話の内容を入力しました。内容を確認してください。</div>' : ''}
    <div class="card"><label>送り先</label><input id="to" value="${esc(state.to)}" placeholder="名前・電話番号">
      <div class="contacts">${CONTACTS.map(c => `<button type="button">${c}</button>`).join('')}</div></div>
    <div class="card"><label>金額</label><input id="amount" class="amt" inputmode="numeric" value="${esc(state.amount)}" placeholder="0">
      <div class="note">残高 ${yen(USER.balance)} から送ります</div></div>
    <button class="primary" id="next">確認する</button>`;
  document.querySelectorAll('.contacts button').forEach(b => b.onclick = () => { document.getElementById('to').value = b.textContent; });
  document.getElementById('next').onclick = () => {
    state.to = document.getElementById('to').value.trim();
    state.amount = document.getElementById('amount').value.replace(/[^0-9]/g, '');
    if (!state.to || !+state.amount) return alert('送り先と金額を入力してください');
    if (+state.amount > USER.balance) return alert('残高が足りません');
    confirmView();
  };
}
function confirmView() {
  document.getElementById('view').innerHTML = `
    <div class="card"><div class="data"><div><span>送り先</span><b>${esc(state.to)}</b></div><div><span>金額</span><b>${yen(+state.amount)}</b></div></div></div>
    <button class="primary" id="send">送る</button>`;
  document.getElementById('send').onclick = () => {
    document.getElementById('view').innerHTML = `<div class="done"><div class="big">✓</div><h2>${esc(state.to)} に ${yen(+state.amount)} 送りました</h2>
      <p class="note">（デモのため実際には送金されていません）</p><a class="primary" href="index.html">ホームに戻る</a></div>`;
  };
}
form();

// ---------- 送金のAI：送るときに気になりそうなことに答える ----------
const SEND_CHIPS = ['送金の上限は？', '手数料はかかる？', '相手を間違えたら？', 'いつ相手に届く？', '今の残高で足りる？', '知らない人に頼まれた'];
const SEND_FAQ = [
  { k: ['上限', 'いくらまで', '限度'], a: '1回の送金は10万円まで、1日の合計は30万円までです（デモの設定です）。本人確認の状況によって、上限が変わることがあります。' },
  { k: ['手数料', '無料', 'お金がかか'], a: 'アプリの残高から、Payを使っている方へ送る場合、手数料は無料です。銀行口座へ出金する場合は、手数料がかかることがあります。' },
  { k: ['間違え', '取り消', 'キャンセル', '戻せ', '返して', '誤'], a: '送金したあとは、取り消すことができません。\nもし間違えて送ってしまったら、すぐに、受け取った相手に連絡して、返してもらうようお願いしてください。連絡がつかないときは、カスタマーセンターにご相談ください。\n送る前の確認画面で、送り先の名前と金額を、よく見てから「送る」を押してください。' },
  { k: ['届', 'いつ', '反映', '時間', 'すぐ'], a: 'Payを使っている方どうしの送金は、すぐに（数秒で）相手の残高に入ります。銀行口座への出金は、翌営業日になることがあります。' },
  { k: ['頼まれ', '詐欺', 'あやし', '怪し', '知らない', '急かさ'], a: '知らない人や、SNSで知り合ったばかりの人から、「送金してほしい」と頼まれたときは、詐欺の可能性があります。\n・急がせる、お金が必要だと言う\n・ギフトカードや電子マネーを買わせる\nこのようなときは、送金せず、家族や、カスタマーセンターに相談してください。送金したあとは、取り消せません。' },
];
const sendChat = createChat({
  title: 'AIアシスタント',
  greet: () => ({ text: '送金のことで気になることはありますか？', chips: SEND_CHIPS }),
  handle(q, chat) {
    // 残高：お客さまの情報なので、連携と生体認証のあとで答える
    if (/残高|足りる|足り/.test(q)) {
      return withConsent(chat, ['balance'], () => {
        chat.ai(`いまの残高は ${yen(USER.balance)} です。${state.amount && +state.amount > USER.balance ? `\n入力中の金額（${yen(+state.amount)}）は、残高より多いため、送れません。` : state.amount && +state.amount ? `\n入力中の金額（${yen(+state.amount)}）は、送れます。` : '\n残高の範囲で、送ることができます。'}`);
        chat.chips(SEND_CHIPS);
      });
    }
    const f = SEND_FAQ.find(e => e.k.some(k => q.includes(k)));
    chat.ai(f ? f.a : 'すみません、うまく理解できませんでした。下の項目から選ぶか、「上限」「手数料」「間違えた」などの言葉で聞いてみてください。');
    chat.chips(SEND_CHIPS);
  },
});
</script>
</body>
</html>
